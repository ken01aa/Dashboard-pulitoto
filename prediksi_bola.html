<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Bola Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-dark: #0F172A;
            --bg-card: #ffffff;
            --bg-secondary: #f8fafc;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: var(--bg-secondary);
            min-height: 100vh;
            color: var(--text-primary);
            position: relative;
            overflow-x: hidden;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 260px;
            background: var(--bg-dark);
            z-index: 0;
            clip-path: ellipse(120% 100% at 50% 0%);
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            padding: 25px;
            background: var(--bg-card);
            border-radius: 20px;
            border: 1px solid var(--border);
            box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
        }

        .header h1 {
            color: var(--bg-dark);
            font-size: 2.2em;
            font-family: 'Space Grotesk', sans-serif;
            margin-bottom: 10px;
        }

        .header p {
            color: var(--text-muted);
        }

        .panel {
            background: var(--bg-card);
            border-radius: 20px;
            padding: 28px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
        }

        .input-section {
            margin-bottom: 30px;
        }

        .input-section label {
            display: block;
            margin-bottom: 15px;
            color: var(--bg-dark);
            font-size: 1.1em;
            font-weight: 700;
        }

        textarea {
            width: 100%;
            height: 200px;
            padding: 16px;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text-primary);
            font-size: 14px;
            line-height: 1.6;
            resize: vertical;
            transition: border 0.3s;
            font-family: 'Plus Jakarta Sans', monospace;
        }

        textarea:focus {
            outline: none;
            border-color: var(--bg-dark);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
            background: var(--bg-card);
        }

        .buttons {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 12px 28px;
            border: none;
            border-radius: 12px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            flex: 1;
            min-width: 160px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        .btn-generate {
            background: var(--bg-dark);
            color: white;
        }

        .btn-copy {
            background: var(--bg-secondary);
            color: var(--bg-dark);
            border: 1px solid var(--border);
        }

        .btn-generate:hover, .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(15, 23, 42, 0.15);
        }

        .output-section {
            margin-top: 40px;
        }

        .preview-area {
            background: var(--bg-secondary);
            border-radius: 12px;
            padding: 20px;
            margin-top: 20px;
            border: 1px solid var(--border);
            overflow-x: auto;
            max-height: 400px;
            overflow-y: auto;
        }

        #previewOutput {
            color: var(--text-primary);
            font-family: 'Space Grotesk', monospace;
            font-size: 12px;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.4;
        }

        .tables-container {
            margin-top: 40px;
        }

        .match-table-preview {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 40px;
            background: white;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.08);
            border: 1px solid var(--border);
        }

        .league-header-preview {
            background: var(--bg-dark);
            color: white;
            padding: 14px;
            text-align: center;
            font-size: 1.3em;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Space Grotesk', sans-serif;
        }

        .table-header-preview {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            font-weight: 700;
        }

        .table-header-preview th {
            padding: 14px 12px;
            text-align: left;
            font-size: 13px;
            border-bottom: 1px solid var(--border);
        }

        .match-table-preview td {
            padding: 12px;
            border-bottom: 1px solid var(--border);
            color: var(--text-primary);
        }

        .score-preview {
            font-weight: 700;
            color: var(--bg-dark);
            font-size: 1em;
        }

        /* Settings Panel */
        .settings-panel {
            background: var(--bg-secondary);
            border-radius: 16px;
            padding: 20px;
            margin: 20px 0;
            border: 1px solid var(--border);
        }

        .settings-title {
            color: var(--bg-dark);
            font-size: 1.1em;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
        }

        .settings-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .setting-group {
            margin-bottom: 15px;
        }

        .setting-group label {
            display: block;
            color: var(--text-secondary);
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 12px;
        }

        .color-picker {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .color-preview {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            border: 1px solid var(--border);
            cursor: pointer;
        }

        input[type="color"] {
            width: 50px;
            height: 38px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: white;
            cursor: pointer;
        }

        select, input[type="range"] {
            width: 100%;
            padding: 8px 12px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 13px;
        }

        .range-value {
            color: var(--bg-dark);
            font-weight: 700;
            margin-left: 10px;
        }

        .font-options {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
            gap: 8px;
            margin-top: 5px;
        }

        .font-option {
            padding: 6px 10px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
            font-size: 12px;
        }

        .font-option:hover {
            border-color: var(--bg-dark);
        }

        .font-option.active {
            background: var(--bg-dark);
            color: white;
            border-color: var(--bg-dark);
        }

        .preset-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            flex-wrap: wrap;
        }

        .preset-btn {
            padding: 8px 14px;
            background: white;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            cursor: pointer;
            font-size: 11px;
            font-weight: 600;
            transition: all 0.2s;
        }

        .preset-btn:hover {
            border-color: var(--bg-dark);
            transform: translateY(-1px);
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--bg-dark);
            color: white;
            padding: 12px 20px;
            border-radius: 12px;
            font-weight: 600;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.3s;
            z-index: 1000;
            box-shadow: 0 5px 15px rgba(15, 23, 42, 0.15);
        }

        .notification.show {
            opacity: 1;
            transform: translateY(0);
        }

        .footer {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            color: var(--text-muted);
            font-size: 0.8em;
            border-top: 1px solid var(--border);
        }

        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            .header h1 {
                font-size: 1.5em;
            }
            .panel {
                padding: 18px;
            }
            .btn {
                min-width: 100%;
                margin-bottom: 8px;
            }
            .settings-grid {
                grid-template-columns: 1fr;
            }
            .font-options {
                grid-template-columns: repeat(2, 1fr);
            }
            .match-table-preview {
                display: block;
                width: 100%;
                overflow: visible;
            }
            .match-table-preview th,
            .match-table-preview td {
                padding: 10px 8px;
                font-size: 12px;
                word-break: break-word;
            }
            .preview-area {
                overflow-x: visible;
                padding: 12px;
            }
        }
    </style>
</head>
<body>

<div class="bg-pattern"></div>

<div class="container">
    <div class="header">
        <h1>⚽ PREDIKSI BOLA PULITOTO ⚽</h1>
        <p>Generator Tabel Prediksi Pertandingan Sepak Bola</p>
    </div>

    <div class="panel">
        <div class="input-section">
            <label for="matchInput">📝 Input Data Pertandingan:</label>
            <textarea id="matchInput" placeholder="Contoh format:
LITHUANIA A LEAGUE
31/05 23:00 WIB Kauno Zalgiris VS DFK Dainava 2 : 1
01/06 20:00 WIB FK Riteriai VS FK Panevezys 1 : 2

ENGLISH PREMIER LEAGUE
01/06 22:00 WIB Manchester United VS Liverpool 3 : 2
02/06 01:00 WIB Chelsea VS Arsenal 1 : 1"></textarea>
            
            <div class="buttons">
                <button class="btn btn-generate" onclick="generateTables()">
                    🚀 Generate Tabel
                </button>
                <button class="btn btn-copy" onclick="copyHTML()">
                    📋 Copy HTML
                </button>
            </div>
        </div>

        <!-- SETTINGS SECTION -->
        <div class="settings-panel">
            <div class="settings-title">🎨 Pengaturan Tampilan</div>
            
            <div class="settings-grid">
                <div class="setting-group">
                    <label>Warna Border Tabel:</label>
                    <div class="color-picker">
                        <div class="color-preview" id="borderColorPreview" style="background: #FFD700;"></div>
                        <input type="color" id="borderColor" value="#FFD700" onchange="updateBorderColor(this.value)">
                    </div>
                </div>
                
                <div class="setting-group">
                    <label>Warna Header Liga:</label>
                    <div class="color-picker">
                        <div class="color-preview" id="headerColorPreview" style="background: #FFD700;"></div>
                        <input type="color" id="headerColor" value="#FFD700" onchange="updateHeaderColor(this.value)">
                    </div>
                </div>
                
                <div class="setting-group">
                    <label>Warna Teks Header:</label>
                    <div class="color-picker">
                        <div class="color-preview" id="headerTextColorPreview" style="background: #000000;"></div>
                        <input type="color" id="headerTextColor" value="#000000" onchange="updateHeaderTextColor(this.value)">
                    </div>
                </div>
                
                <div class="setting-group">
                    <label>Warna Background Tabel:</label>
                    <div class="color-picker">
                        <div class="color-preview" id="tableBgColorPreview" style="background: #0a0a0a;"></div>
                        <input type="color" id="tableBgColor" value="#0a0a0a" onchange="updateTableBgColor(this.value)">
                    </div>
                </div>
                
                <div class="setting-group">
                    <label>Warna Teks Skor:</label>
                    <div class="color-picker">
                        <div class="color-preview" id="scoreColorPreview" style="background: #FFD700;"></div>
                        <input type="color" id="scoreColor" value="#FFD700" onchange="updateScoreColor(this.value)">
                    </div>
                </div>
                
                <div class="setting-group">
                    <label>Ukuran Font (px):</label>
                    <div style="display: flex; align-items: center;">
                        <input type="range" id="fontSize" min="10" max="20" value="12" step="1" oninput="updateFontSize(this.value)">
                        <span class="range-value" id="fontSizeValue">12px</span>
                    </div>
                </div>
                
                <div class="setting-group">
                    <label>Jenis Font:</label>
                    <div class="font-options">
                        <div class="font-option active" onclick="selectFont(this, 'Arial, sans-serif')" style="font-family: Arial, sans-serif;">Arial</div>
                        <div class="font-option" onclick="selectFont(this, 'Georgia, serif')" style="font-family: Georgia, serif;">Georgia</div>
                        <div class="font-option" onclick="selectFont(this, 'Courier New, monospace')" style="font-family: 'Courier New', monospace;">Courier</div>
                        <div class="font-option" onclick="selectFont(this, 'Verdana, sans-serif')" style="font-family: Verdana, sans-serif;">Verdana</div>
                        <div class="font-option" onclick="selectFont(this, 'Tahoma, sans-serif')" style="font-family: Tahoma, sans-serif;">Tahoma</div>
                        <div class="font-option" onclick="selectFont(this, 'Trebuchet MS, sans-serif')" style="font-family: 'Trebuchet MS', sans-serif;">Trebuchet</div>
                    </div>
                </div>
            </div>
            
            <div style="margin-top: 20px;">
                <label style="color: var(--text-secondary); margin-bottom: 10px; display: block; font-size: 12px; font-weight: 600;">Preset Warna:</label>
                <div class="preset-buttons">
                    <button class="preset-btn" onclick="applyPreset('blog_pulitoto')" style="background: #C19A5B; color: #fff;">BLOG PULITOTO</button>
                    <button class="preset-btn" onclick="applyPreset('dashboard_asli')" style="background: #FFD700; color: #000;">DASHBOARD ASLI</button>
                    <button class="preset-btn" onclick="applyPreset('biru_dashboard')" style="background: #007BFF; color: #fff;">BIRU</button>
                    <button class="preset-btn" onclick="applyPreset('hijau_dashboard')" style="background: #28A745; color: #fff;">HIJAU</button>
                    <button class="preset-btn" onclick="applyPreset('merah_dashboard')" style="background: #DC3545; color: #fff;">MERAH</button>
                    <button class="preset-btn" onclick="applyPreset('ungu_dashboard')" style="background: #6F42C1; color: #fff;">UNGU</button>
                </div>
            </div>
        </div>

        <div class="output-section">
            <label style="color: var(--bg-dark); font-size: 1.1em; margin-bottom: 15px; display: block; font-weight: 700;">
                📊 Preview Tabel:
            </label>
            <div id="tablesContainer" class="tables-container"></div>
            
            <label style="color: var(--bg-dark); font-size: 1.1em; margin: 30px 0 15px 0; display: block; font-weight: 700;">
                📝 HTML untuk Blog:
            </label>
            <div class="preview-area">
                <pre id="previewOutput">Generate tabel untuk melihat HTML...</pre>
            </div>
        </div>
    </div>

    <div class="footer">
        Dashboard Prediksi Bola © 2026 • Insight & Discipline by KEN
    </div>
</div>

<div class="notification" id="notification">✓ Berhasil disalin!</div>

<script>
    // ========== SEMUA FUNGSI ASLI TIDAK DIUBAH ==========
    const settings = {
        borderColor: '#FFD700',
        headerColor: '#FFD700',
        headerTextColor: '#000000',
        tableBgColor: '#0a0a0a',
        scoreColor: '#FFD700',
        textColor: '#ffffff',
        fontSize: '12',
        fontFamily: 'Arial, sans-serif'
    };

    function updateBorderColor(color) {
        settings.borderColor = color;
        document.getElementById('borderColorPreview').style.background = color;
        generateTables();
    }

    function updateHeaderColor(color) {
        settings.headerColor = color;
        document.getElementById('headerColorPreview').style.background = color;
        generateTables();
    }

    function updateHeaderTextColor(color) {
        settings.headerTextColor = color;
        document.getElementById('headerTextColorPreview').style.background = color;
        generateTables();
    }

    function updateTableBgColor(color) {
        settings.tableBgColor = color;
        document.getElementById('tableBgColorPreview').style.background = color;
        generateTables();
    }

    function updateScoreColor(color) {
        settings.scoreColor = color;
        document.getElementById('scoreColorPreview').style.background = color;
        generateTables();
    }

    function updateFontSize(size) {
        settings.fontSize = size;
        document.getElementById('fontSizeValue').textContent = size + 'px';
        generateTables();
    }

    function selectFont(element, font) {
        settings.fontFamily = font;
        document.querySelectorAll('.font-option').forEach(opt => opt.classList.remove('active'));
        element.classList.add('active');
        generateTables();
    }

    function applyPreset(presetName) {
        const presets = {
            'blog_pulitoto': {
                borderColor: '#C19A5B',
                headerMainColor: '#C19A5B',
                headerTextColor: '#000000',
                tableBgColor: '#ffffff',
                scoreColor: '#a67c3d',
                textColor: '#333333',
                fontSize: '12',
                fontFamily: 'Arial, sans-serif'
            },
            'dashboard_asli': {
                borderColor: '#FFD700',
                headerMainColor: '#FFD700',
                headerTextColor: '#000000',
                tableBgColor: '#0a0a0a',
                scoreColor: '#FFD700',
                textColor: '#ffffff',
                fontSize: '12',
                fontFamily: 'Arial, sans-serif'
            },
            'biru_dashboard': {
                borderColor: '#007BFF',
                headerMainColor: '#007BFF',
                headerTextColor: '#FFFFFF',
                tableBgColor: '#001a33',
                scoreColor: '#66B2FF',
                textColor: '#ffffff',
                fontSize: '12',
                fontFamily: 'Arial, sans-serif'
            },
            'hijau_dashboard': {
                borderColor: '#28A745',
                headerMainColor: '#28A745',
                headerTextColor: '#FFFFFF',
                tableBgColor: '#0a200a',
                scoreColor: '#90EE90',
                textColor: '#ffffff',
                fontSize: '12',
                fontFamily: 'Arial, sans-serif'
            },
            'merah_dashboard': {
                borderColor: '#DC3545',
                headerMainColor: '#DC3545',
                headerTextColor: '#FFFFFF',
                tableBgColor: '#330a0a',
                scoreColor: '#FF6B6B',
                textColor: '#ffffff',
                fontSize: '12',
                fontFamily: 'Arial, sans-serif'
            },
            'ungu_dashboard': {
                borderColor: '#6F42C1',
                headerMainColor: '#6F42C1',
                headerTextColor: '#FFFFFF',
                tableBgColor: '#1a0a33',
                scoreColor: '#B19CD9',
                textColor: '#ffffff',
                fontSize: '12',
                fontFamily: 'Arial, sans-serif'
            }
        };

        const preset = presets[presetName];
        if (preset) {
            settings.borderColor = preset.borderColor;
            settings.headerColor = preset.headerMainColor;
            settings.headerTextColor = preset.headerTextColor;
            settings.tableBgColor = preset.tableBgColor;
            settings.scoreColor = preset.scoreColor;
            settings.textColor = preset.textColor;
            settings.fontSize = preset.fontSize;
            settings.fontFamily = preset.fontFamily;

            document.getElementById('borderColor').value = preset.borderColor;
            document.getElementById('headerColor').value = preset.headerMainColor;
            document.getElementById('headerTextColor').value = preset.headerTextColor;
            document.getElementById('tableBgColor').value = preset.tableBgColor;
            document.getElementById('scoreColor').value = preset.scoreColor;
            document.getElementById('fontSize').value = preset.fontSize;
            document.getElementById('fontSizeValue').textContent = preset.fontSize + 'px';

            document.getElementById('borderColorPreview').style.background = preset.borderColor;
            document.getElementById('headerColorPreview').style.background = preset.headerMainColor;
            document.getElementById('headerTextColorPreview').style.background = preset.headerTextColor;
            document.getElementById('tableBgColorPreview').style.background = preset.tableBgColor;
            document.getElementById('scoreColorPreview').style.background = preset.scoreColor;

            generateTables();
            showNotification(`✅ Preset "${presetName.replace('_', ' ').toUpperCase()}" diterapkan!`, true);
        }
    }

    function getDates() {
        const today = new Date();
        const tomorrow = new Date(today);
        tomorrow.setDate(tomorrow.getDate() + 1);
        const options = { day: 'numeric', month: 'long', year: 'numeric' };
        const todayStr = today.toLocaleDateString('id-ID', options);
        const tomorrowStr = tomorrow.toLocaleDateString('id-ID', options);
        return { todayStr, tomorrowStr };
    }

    function parseInput(inputText) {
        inputText = inputText.replace(/[–—−]/g, '-');
        const lines = inputText.split('\n');
        const leagues = [];
        let currentLeague = null;

        lines.forEach(line => {
            const trimmed = line.trim();
            if (!trimmed) return;

            if (!/\bvs\b/i.test(trimmed) || !/\d+\s*[:\-–—−]\s*\d+/.test(trimmed)) {
                if (currentLeague && currentLeague.matches.length > 0) {
                    leagues.push(currentLeague);
                }
                currentLeague = {
                    name: trimmed,
                    matches: []
                };
            } else if (currentLeague) {
                const matchRegex = /(\d{2}\/\d{2})\s+(\d{2}:\d{2})\s+(\w+)\s+(.+?)\s+\bvs\b\s+(.+?)\s+(\d+)\s*[:\-–—−]\s*(\d+)/i;
                const match = trimmed.match(matchRegex);
                
                if (match) {
                    currentLeague.matches.push({
                        date: match[1],
                        time: match[2],
                        timezone: match[3],
                        team1: match[4].trim(),
                        team2: match[5].trim(),
                        score1: parseInt(match[6]),
                        score2: parseInt(match[7])
                    });
                }
            }
        });

        if (currentLeague && currentLeague.matches.length > 0) {
            leagues.push(currentLeague);
        }

        return leagues;
    }

    function generateTables() {
        const input = document.getElementById('matchInput').value;
        const leagues = parseInput(input);
        const container = document.getElementById('tablesContainer');
        const preview = document.getElementById('previewOutput');

        container.innerHTML = '';

        if (leagues.length === 0) {
            container.innerHTML = '<div style="color: #FFD700; text-align: center; padding: 40px;">Tidak ada data yang valid. Periksa format input.</div>';
            preview.textContent = '// Tidak ada data yang valid';
            return;
        }

        const { todayStr, tomorrowStr } = getDates();
        const secondaryTextColor = settings.textColor + "cc";

        leagues.forEach(league => {
            const headerBackground = `linear-gradient(90deg, #1a1a1a, ${settings.headerColor}, #1a1a1a)`;

            const tableHTML = `
                <div style="margin-bottom: 30px;">
                    <div class="match-table-preview" style="border-color: ${settings.borderColor}; background: ${settings.tableBgColor};">
                        <div class="league-header-preview" style="background: ${headerBackground}; color: ${settings.headerTextColor}; font-family: ${settings.fontFamily};">${league.name}</div>
                        <table width="100%" cellspacing="0" cellpadding="0" style="font-family: ${settings.fontFamily};">
                            <thead class="table-header-preview" style="background: ${settings.headerColor}22; color: ${settings.headerColor}; border-bottom-color: ${settings.borderColor};">
                                <tr>
                                    <th width="25%" style="border-right-color: ${settings.borderColor}33;">Tanggal & Waktu</th>
                                    <th width="50%" style="border-right-color: ${settings.borderColor}33;">Pertandingan</th>
                                    <th width="25%">Skor</th>
                                </tr>
                            </thead>
                            <tbody>
                                ${league.matches.map(match => `
                                    <tr>
                                        <td style="border-right-color: ${settings.borderColor}22; color: ${secondaryTextColor}; font-size: ${settings.fontSize}px; word-break: break-word;">${match.date} ${match.time}<br><small>${match.timezone}</small></td>
                                        <td style="border-right-color: ${settings.borderColor}22; color: ${settings.textColor}; font-size: ${settings.fontSize}px; word-break: break-word;"><strong>${match.team1}</strong> VS <strong>${match.team2}</strong></td>
                                        <td style="color: ${settings.scoreColor}; font-weight: bold; font-size: ${parseInt(settings.fontSize) + 2}px;">${match.score1} : ${match.score2}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            `;
            container.innerHTML += tableHTML;
        });

        // HTML UNTUK BLOG - MENGGUNAKAN SETTINGS YANG SUDAH ADA
        const headerBackgroundForBlog = `linear-gradient(90deg, #1a1a1a, ${settings.headerColor}, #1a1a1a)`;
        const headerBrightness = getBrightness(settings.headerColor);
        const headerTextColorAuto = headerBrightness > 128 ? '#000000' : '#FFFFFF';
        const tableBorderColor = settings.borderColor;
        const tableHeaderBg = settings.headerColor === '#FFD700' ? 'rgba(255, 215, 0, 0.15)' : `${settings.headerColor}15`;
        const tableHeaderTextColor = settings.headerColor;
        const tableBgColor = settings.tableBgColor;
        const scoreColor = settings.scoreColor;
        const mainTextColor = settings.textColor;
        const secondaryColor = mainTextColor + 'cc';

        let htmlForBlog = `<!-- PREDIKSI BOLA - ${todayStr} - GENERATED BY PREDIKSI BOLA DASHBOARD -->\n`;
        htmlForBlog += `<div class="prediksi-bola-container" style="max-width: 100%; margin: 20px auto; padding: 0; background: transparent !important; border: none !important; font-family: ${settings.fontFamily} !important;">\n\n`;
        htmlForBlog += `    <div class="prediksi-bola-marquee-container" style="background: linear-gradient(90deg, #000000, #1a1a1a, #000000) !important; padding: 12px 15px !important; margin: 0 0 20px 0 !important; border-radius: 8px !important; border: 1px solid ${tableBorderColor} !important; overflow: hidden !important;">\n`;
        htmlForBlog += `        <div class="prediksi-bola-marquee-text" style="color: ${tableHeaderTextColor} !important; font-size: 18px !important; font-weight: bold !important; text-align: center !important; white-space: nowrap !important; animation: prediksi-bola-marquee-animation 25s linear infinite !important; padding: 5px 0 !important; font-family: ${settings.fontFamily} !important;">⚽ PREDIKSI BOLA TANGGAL ${todayStr} – ${tomorrowStr} ⚽</div>\n`;
        htmlForBlog += `    </div>\n\n`;
        htmlForBlog += `    <style>\n`;
        htmlForBlog += `        @keyframes prediksi-bola-marquee-animation { 0% { transform: translateX(100%); } 100% { transform: translateX(-100%); } }\n`;
        htmlForBlog += `        .prediksi-bola-table { width: 100% !important; table-layout: fixed !important; border-collapse: collapse !important; }\n`;
        htmlForBlog += `        .prediksi-bola-table th, .prediksi-bola-table td { overflow-wrap: break-word !important; word-break: break-word !important; white-space: normal !important; }\n`;
        htmlForBlog += `        @media (max-width: 768px) { .prediksi-bola-marquee-text { font-size: 16px !important; animation: prediksi-bola-marquee-animation 20s linear infinite !important; } }\n`;
        htmlForBlog += `        @media (max-width: 480px) { .prediksi-bola-marquee-text { font-size: 14px !important; animation: prediksi-bola-marquee-animation 15s linear infinite !important; } }\n`;
        htmlForBlog += `    </style>\n\n`;

        leagues.forEach(league => {
            htmlForBlog += `    <div style="margin-bottom: 25px; border: 1px solid ${tableBorderColor}; border-radius: 8px; overflow: hidden;">\n`;
            htmlForBlog += `        <div style="background: ${headerBackgroundForBlog}; color: ${headerTextColorAuto}; padding: 12px; text-align: center; font-weight: bold; font-size: ${parseInt(settings.fontSize) + 4}px;">${league.name}</div>\n`;
            htmlForBlog += `        <table class="prediksi-bola-table" style="background: ${tableBgColor}; font-size: ${settings.fontSize}px;">\n`;
            htmlForBlog += `            <thead><tr style="background: ${tableHeaderBg};"><th style="padding: 10px; color: ${tableHeaderTextColor}; border-bottom: 1px solid ${tableBorderColor};">Tanggal & Waktu</th><th style="padding: 10px; color: ${tableHeaderTextColor}; border-bottom: 1px solid ${tableBorderColor};">Pertandingan</th><th style="padding: 10px; color: ${tableHeaderTextColor}; border-bottom: 1px solid ${tableBorderColor};">Skor</th></tr></thead>\n`;
            htmlForBlog += `            <tbody>\n`;
            league.matches.forEach(match => {
                htmlForBlog += `                <tr><td style="padding: 8px 10px; color: ${secondaryColor}; border-bottom: 1px solid ${tableBorderColor}22;">${match.date} ${match.time}<br><small>${match.timezone}</small></td><td style="padding: 8px 10px; color: ${mainTextColor}; border-bottom: 1px solid ${tableBorderColor}22;"><strong>${match.team1}</strong> VS <strong>${match.team2}</strong></td><td style="padding: 8px 10px; color: ${scoreColor}; font-weight: bold; border-bottom: 1px solid ${tableBorderColor}22;">${match.score1} : ${match.score2}</td></tr>\n`;
            });
            htmlForBlog += `            </tbody>\n`;
            htmlForBlog += `        </table>\n`;
            htmlForBlog += `    </div>\n\n`;
        });

        htmlForBlog += `</div>\n<!-- END PREDIKSI BOLA -->`;

        window.htmlForBlog = htmlForBlog;
        preview.textContent = htmlForBlog;
        showNotification('✓ Tabel berhasil digenerate!', true);
    }

    function getBrightness(hexColor) {
        hexColor = hexColor.replace('#', '');
        if (hexColor.length === 3) {
            hexColor = hexColor.split('').map(char => char + char).join('');
        }
        const r = parseInt(hexColor.substr(0, 2), 16);
        const g = parseInt(hexColor.substr(2, 2), 16);
        const b = parseInt(hexColor.substr(4, 2), 16);
        return (r * 299 + g * 587 + b * 114) / 1000;
    }

    function copyHTML() {
        if (!window.htmlForBlog) {
            showNotification('Generate tabel dulu!', false);
            return;
        }
        navigator.clipboard.writeText(window.htmlForBlog)
            .then(() => showNotification('✓ HTML berhasil disalin!', true))
            .catch(() => showNotification('✗ Gagal menyalin', false));
    }

    function showNotification(message, success) {
        const notif = document.getElementById('notification');
        notif.textContent = message;
        notif.style.background = success ? '#10b981' : '#ef4444';
        notif.style.color = '#fff';
        notif.classList.add('show');
        setTimeout(() => {
            notif.classList.remove('show');
        }, 2000);
    }

    window.addEventListener('load', () => {
        document.getElementById('matchInput').value = `LITHUANIA A LEAGUE
31/05 23:00 WIB Kauno Zalgiris VS DFK Dainava 2 : 1
01/06 20:00 WIB FK Riteriai VS FK Panevezys 1 : 2

ENGLISH PREMIER LEAGUE
01/06 22:00 WIB Manchester United VS Liverpool 3 : 2
02/06 01:00 WIB Chelsea VS Arsenal 1 : 1
02/06 20:00 WIB Manchester City VS Tottenham 2 : 0

LA LIGA
02/06 23:00 WIB Barcelona VS Real Madrid 2 : 2
03/06 01:00 WIB Atletico Madrid VS Sevilla 1 : 0`;
        
        setTimeout(() => applyPreset('dashboard_asli'), 100);
    });
</script>
</body>
</html>
