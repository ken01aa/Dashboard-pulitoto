<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prediksi Bola</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #ffffff;
            --bg-secondary: #f8fafc;
            --bg-card: #ffffff;
            --cover-color: #0F172A;
            --accent-success: #10b981;
            --accent-danger: #ef4444;
            --accent-info: #3b82f6;
            --text-primary: #0F172A;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border: #e2e8f0;
        }
        * { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
        }
        .font-display { 
            font-family: 'Space Grotesk', sans-serif; 
        }
        .bg-pattern {
            position: fixed;
            top: 0; left: 0; right: 0;
            height: 260px;
            background: var(--cover-color);
            z-index: 0;
            clip-path: ellipse(120% 100% at 50% 0%);
        }
        .card-note {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            transition: all 0.2s ease;
        }
        .card-note:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.08);
            border-color: var(--cover-color);
        }
        .btn {
            padding: 8px 16px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            border: none;
        }
        .btn-primary {
            background: var(--cover-color);
            color: white;
        }
        .btn-primary:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-success {
            background: var(--accent-success);
            color: white;
        }
        .btn-success:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-secondary {
            background: var(--bg-secondary);
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        .btn-secondary:hover {
            background: var(--border);
            transform: translateY(-1px);
        }
        .toast { 
            animation: slideUp 0.3s ease-out; 
        }
        @keyframes slideUp { 
            from { opacity: 0; transform: translateY(20px); } 
            to { opacity: 1; transform: translateY(0); } 
        }
        .spinner { 
            border: 2px solid #f3f3f3; 
            border-top: 2px solid var(--accent-success); 
            border-radius: 50%; 
            width: 16px; 
            height: 16px; 
            animation: spin 1s linear infinite; 
            display: inline-block; 
        }
        @keyframes spin { 
            0% { transform: rotate(0deg); } 
            100% { transform: rotate(360deg); } 
        }
    </style>
</head>
<body class="bg-stone-100 min-h-screen flex items-center justify-center p-6" style="background: #f8fafc;">
    
    <!-- Background Pattern seperti Note Pad -->
    <div class="bg-pattern"></div>

    <!-- Toast Notification -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 px-4 py-3 bg-green-600 text-white text-sm font-medium rounded-xl shadow-lg hidden items-center gap-2 toast z-50">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
        <span>Prediksi berhasil disalin!</span>
    </div>

    <!-- Hidden Storage -->
    <textarea id="dataPrediksi" class="hidden"></textarea>

    <!-- White Box Wrapper -->
    <div class="relative z-10 w-full max-w-5xl bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col" style="height: 90vh;">
        
        <!-- Header -->
        <div class="px-6 py-4 border-b border-slate-200 flex items-center justify-between flex-shrink-0 bg-white">
            <div>
                <h2 class="font-display text-xl font-bold text-slate-900">Prediksi Bola</h2>
                <p class="text-xs text-slate-500">Konten dari shortq.info</p>
            </div>
            <div class="flex items-center gap-2">
                
                <!-- Tombol Copy -->
                <button onclick="copyPrediksi()" id="btnCopy" class="btn btn-success">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.666 3.888A2.25 2.25 0 0013.5 2.25h-3c-1.03 0-1.9.693-2.166 1.638m7.332 0c.055.194.084.4.084.612v0a.75.75 0 01-.75.75H9a.75.75 0 01-.75-.75v0c0-.212.03-.418.084-.612m7.332 0c.646.049 1.288.11 1.927.184 1.1.128 1.907 1.077 1.907 2.185V19.5a2.25 2.25 0 01-2.25 2.25H6.75A2.25 2.25 0 014.5 19.5V6.257c0-1.108.806-2.057 1.907-2.185a48.208 48.208 0 011.927-.184" /></svg>
                    <span id="textBtnCopy">Copy Prediksi Terbaru</span>
                </button>

                <!-- Tombol Refresh -->
                <button onclick="ambilDataSekarang()" class="btn btn-secondary">
                    <svg id="iconRefresh" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99" /></svg>
                    <div id="spinRefresh" class="spinner hidden"></div>
                    <span>Refresh</span>
                </button>

                <!-- Tombol Buka Situs -->
                <a href="https://shortq.info/prediksibola" target="_blank" class="btn btn-primary">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13.5 6H5.25A2.25 2.25 0 003 8.25v10.5A2.25 2.25 0 005.25 21h10.5A2.25 2.25 0 0018 18.75V10.5m-10.5 6L21 3m0 0h-5.25M21 3v5.25" /></svg>
                    Buka Situs
                </a>
            </div>
        </div>
        
        <!-- Iframe -->
        <div class="flex-1 relative bg-slate-50">
            <iframe 
                id="contentFrame"
                src="https://shortq.info/prediksibola" 
                class="absolute inset-0 w-full h-full border-0"
                allowfullscreen
                loading="lazy">
            </iframe>
        </div>
        
    </div>
    
    <script>
        // Fungsi ambil data otomatis via Proxy cadangan
        async function ambilDataSekarang() {
            const icon = document.getElementById('iconRefresh');
            const spin = document.getElementById('spinRefresh');
            const btnText = document.getElementById('textBtnCopy');
            const dataArea = document.getElementById('dataPrediksi');
            
            // Tampilkan loading
            icon.classList.add('hidden');
            spin.classList.remove('hidden');
            btnText.textContent = "Mengambil data...";
            
            const targetUrl = 'https://shortq.info/prediksibola';
            
            // Daftar Proxy Pengganti (Jika satu error, coba yang lain)
            const proxies = [
                `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`,
                `https://api.allorigins.win/raw?url=${encodeURIComponent(targetUrl)}`
            ];

            let success = false;

            // Coba proxy satu per satu
            for (let i = 0; i < proxies.length; i++) {
                if(success) break;
                
                try {
                    const response = await fetch(proxies[i]);
                    if (!response.ok) continue; // Jika gagal, lanjut proxy berikutnya
                    
                    const htmlText = await response.text();
                    
                    if(htmlText) {
                        const parser = new DOMParser();
                        const doc = parser.parseFromString(htmlText, 'text/html');
                        
                        // Cari ID yang spesifik
                        const prediksiDiv = doc.querySelector('#accordion_2209_content_1 .card-body');
                        
                        if(prediksiDiv) {
                            let teks = prediksiDiv.innerText;
                            dataArea.value = teks;
                            success = true;
                            alert('Data berhasil diperbarui! Klik Copy sekarang.');
                        } else {
                            // Jika format berubah, coba cari cara lain atau lewati
                            console.log("Format tidak ditemukan di proxy " + i);
                        }
                    }
                } catch (error) {
                    console.log("Proxy " + i + " error: " + error);
                }
            }
            
            if(!success) {
                alert('Gagal mengambil data otomatis.\n\nSolusi:\n1. Klik "Buka Situs".\n2. Copy prediksi manual dari sana.\n3. Paste ke mana saja.');
            }
            
            // Kembalikan tombol normal
            icon.classList.remove('hidden');
            spin.classList.add('hidden');
            btnText.textContent = "Copy Prediksi Terbaru";
        }

        function copyPrediksi() {
            var data = document.getElementById('dataPrediksi').value;
            
            if (!data.trim()) {
                alert("Data masih kosong. Klik tombol 'Refresh' dulu.");
                return;
            }

            var tempInput = document.createElement("textarea");
            tempInput.value = data;
            // Styling agar tidak kelihatan di layar
            tempInput.style.position = "fixed";
            tempInput.style.left = "-9999px";
            document.body.appendChild(tempInput);
            tempInput.select();
            tempInput.setSelectionRange(0, 99999); // Untuk mobile
            
            try {
                var successful = document.execCommand('copy');
                if (successful) {
                    showToast();
                } else {
                    alert('Gagal menyalin otomatis. Tekan Ctrl+C manual.');
                }
            } catch (err) {
                alert('Gagal menyalin. Browser tidak mendukung.');
            }
            
            document.body.removeChild(tempInput);
        }

        function showToast() {
            var toast = document.getElementById('toast');
            toast.classList.remove('hidden');
            toast.classList.add('flex');
            setTimeout(function() {
                toast.classList.add('hidden');
                toast.classList.remove('flex');
            }, 2500);
        }
    </script>

</body>
</html>
