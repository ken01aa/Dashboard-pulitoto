<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Auto Hapus Komentar YouTube - OAuth</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --cover-color: #0F172A;
    --bg-secondary: #f8fafc;
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --border: #e2e8f0;
    --accent-info: #3b82f6;
    --accent-danger: #ef4444;
    --accent-success: #10b981;
    --accent-warning: #f59e0b;
}

body {
    font-family: 'Plus Jakarta Sans', sans-serif;
    background: #f8fafc;
    color: var(--text-primary);
    padding: 25px;
    min-height: 100vh;
}

.bg-pattern {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 260px;
    background: var(--cover-color);
    z-index: 0;
    clip-path: ellipse(120% 100% at 50% 0%);
}

.container {
    position: relative;
    z-index: 10;
    max-width: 1700px;
    margin: auto;
}

.topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 25px;
    background: white;
    padding: 20px 28px;
    border-radius: 20px;
    border: 1px solid var(--border);
    box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
}

.logo {
    font-size: 28px;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
    color: var(--cover-color);
}

.logo span {
    color: var(--accent-danger);
}

.status-grid {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.status-card {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    padding: 14px 20px;
    border-radius: 16px;
    min-width: 140px;
}

.status-title {
    font-size: 11px;
    color: var(--text-secondary);
    margin-bottom: 5px;
    font-weight: 600;
}

.status-value {
    font-size: 20px;
    font-weight: 700;
    font-family: 'Space Grotesk', sans-serif;
}

.online {
    color: #10b981;
}

.setting-panel {
    background: white;
    border: 1px solid var(--border);
    padding: 20px 24px;
    border-radius: 20px;
    margin-bottom: 25px;
}

.setting-row {
    display: flex;
    gap: 15px;
    align-items: center;
    flex-wrap: wrap;
}

input, select {
    background: var(--bg-secondary);
    border: 1px solid var(--border);
    padding: 12px 16px;
    border-radius: 12px;
    font-size: 14px;
    outline: none;
    width: 200px;
}

button {
    background: var(--cover-color);
    border: none;
    padding: 12px 22px;
    border-radius: 12px;
    color: white;
    font-weight: 600;
    cursor: pointer;
    font-size: 13px;
    transition: 0.3s;
}

button:hover {
    transform: translateY(-2px);
    background: #1e293b;
}

button.danger-btn {
    background: var(--accent-danger);
}
button.danger-btn:hover {
    background: #dc2626;
}

button.success-btn {
    background: var(--accent-success);
}
button.success-btn:hover {
    background: #059669;
}

button.warning-btn {
    background: var(--accent-warning);
}
button.warning-btn:hover {
    background: #d97706;
}

.btn-google {
    background: #fff;
    color: #333;
    border: 1px solid #ddd;
    display: inline-flex;
    align-items: center;
    gap: 10px;
}
.btn-google:hover {
    background: #f5f5f5;
    transform: none;
}

.login-info {
    background: #e0f2fe;
    border: 1px solid #7dd3fc;
    border-radius: 12px;
    padding: 8px 16px;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 10px;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    border-bottom: 2px solid var(--border);
}

.tab-btn {
    background: transparent;
    color: var(--text-secondary);
    border-radius: 12px 12px 0 0;
    padding: 12px 24px;
    margin-bottom: -2px;
}

.tab-btn.active {
    background: white;
    color: var(--cover-color);
    border-bottom: 2px solid var(--cover-color);
    transform: none;
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

.video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
    gap: 25px;
}

.video-card {
    background: white;
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow: hidden;
    transition: 0.3s;
}

.video-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 25px rgba(15, 23, 42, 0.1);
}

.video-header {
    padding: 14px 16px;
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    border-bottom: 1px solid var(--border);
}

.video-title {
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
    flex: 1;
}

.comment-count {
    background: var(--bg-secondary);
    padding: 4px 12px;
    border-radius: 30px;
    font-size: 11px;
    font-weight: 600;
}

.thumbnail-box {
    display: block;
    width: 100%;
    height: 200px;
    overflow: hidden;
}

.thumbnail-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: 0.3s;
}

.thumbnail-box:hover img {
    transform: scale(1.03);
}

.comment-section {
    padding: 16px;
    max-height: 350px;
    overflow-y: auto;
    background: var(--bg-secondary);
}

.comment-item {
    background: white;
    border: 1px solid var(--border);
    padding: 12px;
    border-radius: 14px;
    margin-bottom: 12px;
    position: relative;
}

.comment-item.auto-deleted {
    background: #fef2f2;
    border-left: 3px solid var(--accent-danger);
}

.comment-user {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
}

.comment-user img {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    border: 1.5px solid var(--accent-info);
    object-fit: cover;
}

.comment-name {
    font-size: 13px;
    font-weight: 700;
}

.comment-time {
    font-size: 10px;
    color: var(--text-secondary);
    margin-top: 3px;
}

.comment-text {
    font-size: 12px;
    line-height: 1.5;
    color: var(--text-secondary);
}

.delete-badge {
    position: absolute;
    top: 8px;
    right: 8px;
    background: var(--accent-danger);
    color: white;
    padding: 2px 8px;
    border-radius: 12px;
    font-size: 9px;
    font-weight: 600;
}

.deleted-table-container {
    background: white;
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow-x: auto;
}

.deleted-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

.deleted-table th {
    background: var(--bg-secondary);
    padding: 14px 12px;
    text-align: left;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
}

.deleted-table td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
}

.badge-deleted {
    background: var(--accent-danger);
    color: white;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 600;
}

.toast {
    position: fixed;
    top: 25px;
    right: -400px;
    width: 360px;
    background: white;
    border-left: 4px solid #10b981;
    border-radius: 16px;
    padding: 16px;
    transition: 0.4s;
    z-index: 999;
    box-shadow: 0 10px 35px rgba(0,0,0,0.15);
}

.toast.show {
    right: 25px;
}

.toast-text {
    font-size: 13px;
    color: var(--text-secondary);
}

.auto-delete-active {
    background: #dc2626;
    animation: pulse 1s infinite;
}

@keyframes pulse {
    0% { opacity: 1; }
    50% { opacity: 0.7; }
    100% { opacity: 1; }
}

@media(max-width: 768px) {
    body { padding: 15px; }
    .video-grid { grid-template-columns: 1fr; }
    .thumbnail-box { height: 180px; }
    button, input, select { width: 100%; }
    .toast { width: 90%; right: -90%; }
}
</style>
</head>
<body>

<div class="bg-pattern"></div>

<div class="toast" id="toast">
    <div class="toast-title">🔔 KOMENTAR BARU</div>
    <div class="toast-text" id="toastText"></div>
</div>

<div class="container">
    <div class="topbar">
        <div class="logo">
            AUTO <span>HAPUS KOMENTAR</span>
        </div>
        <div class="status-grid">
            <div class="status-card"><div class="status-title">STATUS</div><div class="status-value online">● ONLINE</div></div>
            <div class="status-card"><div class="status-title">TOTAL VIDEO</div><div class="status-value" id="totalVideos">0</div></div>
            <div class="status-card"><div class="status-title">AUTO HAPUS</div><div class="status-value" id="autoDeleteStatus">OFF</div></div>
            <div class="status-card"><div class="status-title">KOMENTAR DIHAPUS</div><div class="status-value" id="deletedCount">0</div></div>
        </div>
    </div>

    <div class="setting-panel">
        <div class="setting-row">
            <div id="loginSection">
                <button id="googleLoginBtn" class="btn-google">🔑 LOGIN DENGAN GOOGLE</button>
            </div>
            <div id="userInfoSection" style="display:none;">
                <div class="login-info">
                    <span>✅</span>
                    <span id="userEmail">-</span>
                    <button id="logoutBtn" class="danger-btn" style="padding:4px 12px;font-size:11px;">LOGOUT</button>
                </div>
            </div>
            <button id="toggleAutoDeleteBtn" class="danger-btn" disabled>🗑️ AKTIFKAN AUTO HAPUS</button>
            <button onclick="manualRefresh()">🔄 REFRESH KOMENTAR</button>
            <button onclick="clearAllHistory()" class="danger-btn">🗑️ HAPUS HISTORY</button>
            <button onclick="testSound()" class="success-btn">🔊 TEST SUARA</button>
        </div>
    </div>

    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('monitor')">📺 MONITOR KOMENTAR</button>
        <button class="tab-btn" onclick="switchTab('deleted')">🗑️ KOMENTAR YANG DIHAPUS</button>
    </div>

    <div id="monitorTab" class="tab-content active">
        <div class="video-grid" id="videoGrid"></div>
    </div>

    <div id="deletedTab" class="tab-content">
        <div class="deleted-table-container">
            <table class="deleted-table">
                <thead>
                    <tr><th>Waktu Dihapus</th><th>Pengguna</th><th>Komentar</th><th>Video</th><th>Status</th></tr>
                </thead>
                <tbody id="deletedTableBody">
                    <tr><td colspan="5" style="text-align:center;padding:40px;">⏳ Memuat data dari Firebase...</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
// ==================== KONFIGURASI ====================
// GANTI CLIENT_ID_INI_DENGAN_CLIENT_ID_ANDA dari Google Cloud Console!
const GOOGLE_CLIENT_ID = "1054729621150-hihuerg6afgn7vmgimhnaf98arel6pjd.apps.googleusercontent.com"; // <=== GANTI INI!

const FIREBASE_URL = "https://monitor-5432a-default-rtdb.asia-southeast1.firebasedatabase.app/";

const rawVideos = [
    { url: "https://youtu.be/dgiQObBtcOY", title: "PULITOTO - Tutorial Lengkap"},
    { url: "https://youtu.be/b18cWbAKIWw", title: "CARA DAFTAR AKUN BARU"},
    { url: "https://youtu.be/FwxvsPpT5hk", title: "CARA DEPOSIT VIA BANK & E-WALLET"},
    { url: "https://youtu.be/4TDTgBHmO4w", title: "CARA WITHDRAW SALDO KE REKENING"},
    { url: "https://youtu.be/e1y9fQzjISc", title: "DEPOSIT QRIS INSTANT"},
    { url: "https://youtu.be/XVHQZdBVowI", title: "CARIKAN ID USERNAME"},
    { url: "https://youtu.be/vjgSH6y7PQ0", title: "APK ANDROID - Install & Login"},
    { url: "https://youtu.be/vSoh5-Ecg2U", title: "APK IOS - Panduan Lengkap"}
];

function extractVideoId(url) {
    let match = url.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
    if(match) return match[1];
    match = url.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
    if(match) return match[1];
    return null;
}

const videos = rawVideos.map(v => ({id: extractVideoId(v.url), title: v.title})).filter(v => v.id);
document.getElementById("totalVideos").innerText = videos.length;

// ==================== VARIABEL GLOBAL ====================
let accessToken = null;
let currentUser = null;
let autoDeleteActive = false;
let deletedCommentsLog = [];
let savedComments = {};
let savedCommentsDetail = {};
let isFirstLoad = true;
let refreshInterval = null;
let deleteQueue = [];
let isDeleting = false;

// ==================== OAUTH 2.0 GOOGLE LOGIN ====================
function initGoogleAuth() {
    if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID === "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com") {
        console.warn("⚠️ Google Client ID belum diisi! Login tidak akan berfungsi.");
        showToast("⚠️ Silakan ganti GOOGLE_CLIENT_ID dengan Client ID dari Google Cloud Console!");
        return;
    }
    
    google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleCredentialResponse,
        auto_select: false,
        cancel_on_tap_outside: true
    });
    
    // Render tombol login
    google.accounts.id.renderButton(
        document.getElementById("googleLoginBtn"),
        { theme: "outline", size: "large", width: 200 }
    );
}

function handleCredentialResponse(response) {
    console.log("🔐 Login response received");
    
    // Decode JWT token untuk mendapatkan user info
    const payload = parseJwt(response.credential);
    currentUser = {
        email: payload.email,
        name: payload.name,
        picture: payload.picture
    };
    
    // Sekarang dapatkan access token untuk YouTube API
    requestAccessToken();
}

function parseJwt(token) {
    const base64Url = token.split('.')[1];
    const base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
    const jsonPayload = decodeURIComponent(atob(base64).split('').map(c => {
        return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(''));
    return JSON.parse(jsonPayload);
}

function requestAccessToken() {
    // Token endpoint untuk mendapatkan access token
    // Google One Tap hanya memberikan ID token, perlu request terpisah untuk access token
    
    // Metode alternatif: Gunakan token client-side
    // Untuk YouTube API, kita perlu scope yang tepat
    
    // Redirect ke OAuth flow untuk mendapatkan access token dengan scope yang benar
    const redirectUri = window.location.origin + window.location.pathname;
    const scope = "https://www.googleapis.com/auth/youtube.force-ssl";
    const authUrl = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${GOOGLE_CLIENT_ID}&redirect_uri=${encodeURIComponent(redirectUri)}&response_type=token&scope=${encodeURIComponent(scope)}&prompt=consent`;
    
    // Simpan current URL untuk redirect balik
    localStorage.setItem("oauth_redirect", window.location.href);
    window.location.href = authUrl;
}

// Handle redirect setelah OAuth
function handleOAuthRedirect() {
    const hash = window.location.hash;
    if (hash && hash.includes("access_token")) {
        const params = new URLSearchParams(hash.substring(1));
        accessToken = params.get("access_token");
        
        if (accessToken) {
            localStorage.setItem("youtube_access_token", accessToken);
            // Ambil user info dari token
            fetchUserInfo();
            window.location.hash = "";
        }
    }
    
    // Cek token yang tersimpan
    const savedToken = localStorage.getItem("youtube_access_token");
    if (savedToken && !accessToken) {
        accessToken = savedToken;
        fetchUserInfo();
    }
}

async function fetchUserInfo() {
    try {
        const response = await fetch("https://www.googleapis.com/youtube/v3/channels?part=snippet&mine=true", {
            headers: { "Authorization": `Bearer ${accessToken}` }
        });
        
        if (response.ok) {
            const data = await response.json();
            if (data.items && data.items[0]) {
                currentUser = {
                    email: data.items[0].snippet.title,
                    name: data.items[0].snippet.title,
                    picture: data.items[0].snippet.thumbnails.default.url
                };
                updateUILoginSuccess();
            }
        } else if (response.status === 401) {
            // Token expired
            localStorage.removeItem("youtube_access_token");
            accessToken = null;
            updateUILogout();
        }
    } catch(e) {
        console.error("Error fetching user info:", e);
    }
}

function updateUILoginSuccess() {
    document.getElementById("loginSection").style.display = "none";
    document.getElementById("userInfoSection").style.display = "block";
    document.getElementById("userEmail").innerText = currentUser?.email || "Logged In";
    document.getElementById("toggleAutoDeleteBtn").disabled = false;
    showToast(`✅ Login berhasil sebagai ${currentUser?.email}`);
    
    // Mulai monitoring
    silentLoadAll();
}

function updateUILogout() {
    document.getElementById("loginSection").style.display = "block";
    document.getElementById("userInfoSection").style.display = "none";
    document.getElementById("toggleAutoDeleteBtn").disabled = true;
    document.getElementById("toggleAutoDeleteBtn").innerText = "🗑️ AKTIFKAN AUTO HAPUS";
    document.getElementById("toggleAutoDeleteBtn").classList.remove("auto-delete-active");
    autoDeleteActive = false;
    document.getElementById("autoDeleteStatus").innerText = "OFF";
    accessToken = null;
    currentUser = null;
    localStorage.removeItem("youtube_access_token");
}

function logout() {
    autoDeleteActive = false;
    updateUILogout();
    showToast("✅ Logout berhasil");
}

// ==================== AUTO DELETE COMMENT ====================
async function deleteComment(commentId, videoId, authorName, commentText, videoTitle) {
    if (!accessToken) {
        console.log("❌ Tidak ada access token, skip hapus");
        return false;
    }
    
    try {
        const response = await fetch(`https://www.googleapis.com/youtube/v3/comments?id=${commentId}`, {
            method: 'DELETE',
            headers: {
                'Authorization': `Bearer ${accessToken}`,
                'Content-Type': 'application/json'
            }
        });
        
        if (response.ok) {
            console.log(`✅ Berhasil menghapus komentar dari ${authorName}`);
            
            // Simpan ke history
            await addDeletedCommentToFirebase(authorName, commentText, videoTitle, videoId, commentId);
            
            // Notifikasi dengan suara
            speakText("SATU KOMENTAR TELAH DIHAPUS");
            showToast(`🗑️ Komentar dari ${authorName} telah dihapus dari YouTube!`);
            
            return true;
        } else {
            const error = await response.text();
            console.error(`❌ Gagal hapus komentar: ${error}`);
            if (response.status === 401) {
                // Token expired, minta login ulang
                showToast("⚠️ Token expired, silakan login ulang");
                logout();
            }
            return false;
        }
    } catch(e) {
        console.error("Error deleting comment:", e);
        return false;
    }
}

// Proses antrian hapus komentar
async function processDeleteQueue() {
    if (isDeleting || deleteQueue.length === 0) return;
    
    isDeleting = true;
    
    while (deleteQueue.length > 0) {
        const item = deleteQueue.shift();
        if (autoDeleteActive) {
            await deleteComment(item.commentId, item.videoId, item.authorName, item.commentText, item.videoTitle);
            // Delay untuk menghindari rate limit
            await new Promise(resolve => setTimeout(resolve, 1500));
        }
    }
    
    isDeleting = false;
}

// ==================== SUARA CEWEK LEMBUT ====================
let speechEnabled = true;
let selectedVoice = null;

function getIndonesianFemaleVoice() {
    const voices = speechSynthesis.getVoices();
    const priorityList = ["Google Bahasa Indonesia", "Microsoft Siti Online", "Siti", "Female", "Perempuan"];
    
    for (const priority of priorityList) {
        const voice = voices.find(v => (v.lang === "id-ID" || v.lang === "id") && v.name.includes(priority));
        if (voice) return voice;
    }
    const indonesianVoice = voices.find(v => v.lang === "id-ID");
    if (indonesianVoice) return indonesianVoice;
    return voices[0];
}

function initVoice() {
    const voices = speechSynthesis.getVoices();
    if (voices.length > 0) {
        selectedVoice = getIndonesianFemaleVoice();
    }
}

if (speechSynthesis) {
    speechSynthesis.onvoiceschanged = () => initVoice();
    setTimeout(() => initVoice(), 500);
}

function speakText(text) {
    if (!speechEnabled) return;
    try {
        if (speechSynthesis.speaking) speechSynthesis.cancel();
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "id-ID";
        utterance.rate = 0.85;
        utterance.pitch = 1.15;
        utterance.volume = 1.0;
        if (selectedVoice) utterance.voice = selectedVoice;
        speechSynthesis.speak(utterance);
    } catch(e) { console.log("Speech error:", e); }
}

function testSound() {
    speakText("SATU KOMENTAR TELAH DIHAPUS");
    showToast("🔊 Test suara! Seharusnya terdengar 'SATU KOMENTAR TELAH DIHAPUS'");
}

function showDesktopNotification(title, body) {
    if ("Notification" in window && Notification.permission === "granted") {
        new Notification(title, { body: body, icon: "https://www.youtube.com/s/desktop/014d2e5f/img/favicon_144x144.png" });
    }
}

function showToast(msg) {
    const toast = document.getElementById("toast");
    document.getElementById("toastText").innerHTML = escapeHtml(msg);
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 4000);
}

// ==================== FIREBASE HISTORY ====================
async function loadHistoryFromFirebase() {
    try {
        const response = await fetch(`${FIREBASE_URL}deletedHistory.json`);
        const data = await response.json();
        if(data) {
            deletedCommentsLog = Object.values(data);
            deletedCommentsLog.sort((a,b) => b.timestamp - a.timestamp);
            updateDeletedCount();
            renderDeletedTable();
        }
    } catch(e) { console.error("Gagal load dari Firebase:", e); }
}

async function addDeletedCommentToFirebase(authorName, commentText, videoTitle, videoId, commentId) {
    const now = new Date();
    const formattedTime = now.toLocaleString('id-ID');
    
    const alreadyExists = deletedCommentsLog.some(log => log.commentId === commentId);
    if(alreadyExists) return;
    
    const newComment = {
        deletedAt: formattedTime,
        authorName: authorName,
        commentText: commentText,
        videoTitle: videoTitle,
        videoId: videoId,
        commentId: commentId,
        timestamp: now.getTime()
    };
    
    deletedCommentsLog.unshift(newComment);
    if(deletedCommentsLog.length > 500) deletedCommentsLog = deletedCommentsLog.slice(0, 500);
    
    updateDeletedCount();
    renderDeletedTable();
    
    try {
        const newId = Date.now() + "_" + Math.random().toString(36).substr(2, 6);
        await fetch(`${FIREBASE_URL}deletedHistory/${newId}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(newComment)
        });
    } catch(e) { console.error("Gagal save ke Firebase:", e); }
}

async function clearAllHistory() {
    if(!confirm("⚠️ PERINGATAN: Ini akan menghapus SEMUA history! Yakin?")) return;
    try {
        await fetch(`${FIREBASE_URL}deletedHistory.json`, { method: 'PUT', body: JSON.stringify(null) });
        deletedCommentsLog = [];
        updateDeletedCount();
        renderDeletedTable();
        showToast("✅ Semua history telah dihapus");
    } catch(e) { showToast("❌ Gagal menghapus history"); }
}

function updateDeletedCount() {
    document.getElementById("deletedCount").innerText = deletedCommentsLog.length;
}

function renderDeletedTable() {
    const tbody = document.getElementById("deletedTableBody");
    if(!tbody) return;
    if(deletedCommentsLog.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;">✨ Belum ada komentar yang dihapus ✨</td></tr>';
        return;
    }
    tbody.innerHTML = deletedCommentsLog.map(log => `
        <tr>
            <td style="white-space:nowrap;">${escapeHtml(log.deletedAt)}</td>
            <td><strong>${escapeHtml(log.authorName)}</strong></td>
            <td style="max-width:300px;">${escapeHtml(log.commentText)}</td>
            <td style="max-width:250px;">${escapeHtml(log.videoTitle)}</td>
            <td><span class="badge-deleted">TERHAPUS</span></td>
        </tr>
    `).join('');
}

// ==================== LOAD COMMENTS DARI YOUTUBE ====================
async function loadAllComments() {
    const grid = document.getElementById("videoGrid");
    if(grid) grid.innerHTML = '<div style="text-align:center;padding:50px;">🔄 Memuat video...</div>';
    
    const promises = videos.map(video => loadVideoCard(video));
    const cards = await Promise.all(promises);
    
    if(grid) {
        grid.innerHTML = "";
        cards.forEach(card => { if(card) grid.appendChild(card); });
    }
}

async function loadVideoCard(video) {
    try {
        const apiUrl = `https://www.googleapis.com/youtube/v3/commentThreads?part=snippet&videoId=${video.id}&maxResults=10&order=time&key=AIzaSyC0QKWbbW4M9_kRu2e0PQ3psM8RYXv4GDI`;
        const response = await fetch(apiUrl);
        if(!response.ok) return createErrorCard(video);
        
        const data = await response.json();
        let commentsHTML = "";
        let totalComments = 0;
        const currentCommentIds = [];
        const currentCommentsMap = new Map();
        
        if(data.items && data.items.length > 0) {
            totalComments = data.items.length;
            for(const item of data.items) {
                const comment = item.snippet.topLevelComment.snippet;
                const commentId = item.snippet.topLevelComment.id;
                currentCommentIds.push(commentId);
                currentCommentsMap.set(commentId, {
                    authorName: comment.authorDisplayName,
                    commentText: comment.textDisplay,
                    videoTitle: video.title,
                    videoId: video.id
                });
                
                const oldList = savedComments[video.id] || [];
                if(!isFirstLoad && !oldList.includes(commentId) && autoDeleteActive && accessToken) {
                    // KOMENTAR BARU! LANGSUNG HAPUS OTOMATIS
                    speakText("SATU KOMENTAR NEGATIF YOUTUBE");
                    showToast(`⚠️ Komentar baru dari ${comment.authorDisplayName} - Sedang dihapus...`);
                    
                    // Tambahkan ke antrian hapus
                    deleteQueue.push({
                        commentId: commentId,
                        videoId: video.id,
                        authorName: comment.authorDisplayName,
                        commentText: comment.textDisplay,
                        videoTitle: video.title
                    });
                    processDeleteQueue();
                }
                
                const isMarkedDeleted = deletedCommentsLog.some(log => log.commentId === commentId);
                
                commentsHTML += `
                    <div class="comment-item ${isMarkedDeleted ? 'auto-deleted' : ''}">
                        ${isMarkedDeleted ? '<div class="delete-badge">🗑️ DIHAPUS</div>' : ''}
                        <div class="comment-user">
                            <img src="${comment.authorProfileImageUrl || 'https://ui-avatars.com/api/?background=0F172A&color=fff&name='+encodeURIComponent(comment.authorDisplayName?.charAt(0)||'U')}">
                            <div><div class="comment-name">${escapeHtml(comment.authorDisplayName)}</div>
                            <div class="comment-time">${new Date(comment.publishedAt).toLocaleString('id-ID')}</div></div>
                        </div>
                        <div class="comment-text">${escapeHtml(comment.textDisplay)}</div>
                    </div>
                `;
            }
        }
        
        if(!savedCommentsDetail[video.id]) savedCommentsDetail[video.id] = {};
        for(const [cid, detail] of currentCommentsMap) {
            savedCommentsDetail[video.id][cid] = detail;
        }
        savedComments[video.id] = currentCommentIds;
        
        const card = document.createElement("div");
        card.className = "video-card";
        card.innerHTML = `
            <div class="video-header">
                <div class="video-title">${escapeHtml(video.title)}</div>
                <div class="comment-count">💬 ${totalComments}</div>
            </div>
            <a href="https://www.youtube.com/watch?v=${video.id}" target="_blank" class="thumbnail-box">
                <img src="https://img.youtube.com/vi/${video.id}/maxresdefault.jpg" onerror="this.src='https://img.youtube.com/vi/${video.id}/hqdefault.jpg'">
            </a>
            <div class="comment-section">${commentsHTML || '<div style="padding:20px;text-align:center;">✨ Belum ada komentar ✨</div>'}</div>
        `;
        return card;
    } catch(e) {
        return createErrorCard(video);
    }
}

function createErrorCard(video) {
    const card = document.createElement("div");
    card.className = "video-card";
    card.innerHTML = `<div class="video-header"><div class="video-title">⚠️ ${escapeHtml(video.title)}</div><div class="comment-count">❌ Error</div></div>
        <div class="comment-section"><div style="padding:20px;text-align:center;">Gagal memuat komentar</div></div>`;
    return card;
}

function escapeHtml(str) {
    if(!str) return "";
    return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

function manualRefresh() {
    loadAllComments();
    showToast("🔄 Memperbarui komentar...");
}

function switchTab(tab) {
    const monitor = document.getElementById("monitorTab");
    const deleted = document.getElementById("deletedTab");
    const btns = document.querySelectorAll(".tab-btn");
    btns.forEach(btn => btn.classList.remove("active"));
    if(tab === 'monitor') {
        monitor.classList.add("active");
        deleted.classList.remove("active");
        btns[0].classList.add("active");
    } else {
        monitor.classList.remove("active");
        deleted.classList.add("active");
        btns[1].classList.add("active");
        renderDeletedTable();
    }
}

function toggleAutoDelete() {
    if (!accessToken) {
        showToast("⚠️ Silakan login terlebih dahulu!");
        return;
    }
    
    autoDeleteActive = !autoDeleteActive;
    const btn = document.getElementById("toggleAutoDeleteBtn");
    const statusSpan = document.getElementById("autoDeleteStatus");
    
    if (autoDeleteActive) {
        btn.innerText = "⏹️ NONAKTIFKAN AUTO HAPUS";
        btn.classList.add("auto-delete-active");
        statusSpan.innerText = "ON";
        statusSpan.style.color = "#ef4444";
        showToast("🗑️ AUTO HAPUS AKTIF! Semua komentar baru akan otomatis dihapus dari YouTube");
        speakText("AUTO HAPUS TELAH DIAKTIFKAN");
    } else {
        btn.innerText = "🗑️ AKTIFKAN AUTO HAPUS";
        btn.classList.remove("auto-delete-active");
        statusSpan.innerText = "OFF";
        statusSpan.style.color = "";
        showToast("⏹️ Auto hapus dinonaktifkan");
        speakText("AUTO HAPUS DINONAKTIFKAN");
    }
}

async function silentLoadAll() {
    await loadHistoryFromFirebase();
    await loadAllComments();
    isFirstLoad = false;
    
    // Auto refresh setiap 15 detik (lebih cepat untuk deteksi komentar baru)
    if(refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(() => {
        if (autoDeleteActive) {
            loadAllComments();
        }
    }, 15000);
}

if ("Notification" in window && Notification.permission === "default") {
    Notification.requestPermission();
}

// Handle OAuth redirect
handleOAuthRedirect();

// Cek apakah sudah login dari localStorage
const savedToken = localStorage.getItem("youtube_access_token");
if (savedToken) {
    accessToken = savedToken;
    fetchUserInfo();
}

document.getElementById("toggleAutoDeleteBtn").addEventListener("click", toggleAutoDelete);
document.getElementById("logoutBtn").addEventListener("click", logout);

script.async = true;
script.defer = true;
script.onload = () => {
    if (GOOGLE_CLIENT_ID && GOOGLE_CLIENT_ID !== "YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com") {
        initGoogleAuth();
    }
};
document.head.appendChild(script);

// Initial load
loadHistoryFromFirebase();
setTimeout(() => {
    if (!accessToken) {
        // Tampilkan video tanpa login
        loadAllComments();
    }
}, 1000);

// Global functions
window.manualRefresh = manualRefresh;
window.clearAllHistory = clearAllHistory;
window.switchTab = switchTab;
window.testSound = testSound;
