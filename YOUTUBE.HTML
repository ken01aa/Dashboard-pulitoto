<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Komentar Negatif YouTube - Firebase Sync</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

:root {
    --cover-color: #0F172A;
    --bg-secondary: #f8fafc;
    --text-primary: #0F172A;
    --text-secondary: #475569;
    --border: #e2e8f0;
    --accent-info: #3b82f6;
    --accent-danger: #ef4444;
    --accent-success: #10b981;
}

body{
font-family: 'Plus Jakarta Sans', sans-serif;
background: #f8fafc;
color: var(--text-primary);
padding: 25px;
min-height: 100vh;
}

.bg-pattern {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 260px;
    background: var(--cover-color);
    z-index: 0;
    clip-path: ellipse(120% 100% at 50% 0%);
}

.container{
position: relative;
z-index: 10;
max-width: 1700px;
margin: auto;
}

.topbar{
display: flex;
justify-content: space-between;
align-items: center;
gap: 20px;
flex-wrap: wrap;
margin-bottom: 25px;
background: white;
padding: 20px 28px;
border-radius: 20px;
border: 1px solid var(--border);
box-shadow: 0 8px 20px rgba(15, 23, 42, 0.08);
}

.logo{
font-size: 28px;
font-weight: 700;
font-family: 'Space Grotesk', sans-serif;
color: var(--cover-color);
}

.logo span{
color: var(--accent-info);
}

.status-grid{
display: flex;
gap: 15px;
flex-wrap: wrap;
}

.status-card{
background: var(--bg-secondary);
border: 1px solid var(--border);
padding: 14px 20px;
border-radius: 16px;
min-width: 140px;
}

.status-title{
font-size: 11px;
color: var(--text-muted);
margin-bottom: 5px;
font-weight: 600;
}

.status-value{
font-size: 20px;
font-weight: 700;
font-family: 'Space Grotesk', sans-serif;
}

.online{
color: #10b981;
}

.setting-panel{
background: white;
border: 1px solid var(--border);
padding: 20px 24px;
border-radius: 20px;
margin-bottom: 25px;
}

.setting-row{
display: flex;
gap: 15px;
align-items: center;
flex-wrap: wrap;
}

input{
background: var(--bg-secondary);
border: 1px solid var(--border);
padding: 12px 16px;
border-radius: 12px;
font-size: 14px;
outline: none;
width: 200px;
}

button{
background: var(--cover-color);
border: none;
padding: 12px 22px;
border-radius: 12px;
color: white;
font-weight: 600;
cursor: pointer;
font-size: 13px;
transition: 0.3s;
}

button:hover{
transform: translateY(-2px);
background: #1e293b;
}

button.danger-btn {
    background: var(--accent-danger);
}
button.danger-btn:hover {
    background: #dc2626;
}

button.success-btn {
    background: var(--accent-success);
}
button.success-btn:hover {
    background: #059669;
}

.tabs {
    display: flex;
    gap: 10px;
    margin-bottom: 25px;
    border-bottom: 2px solid var(--border);
}

.tab-btn {
    background: transparent;
    color: var(--text-secondary);
    border-radius: 12px 12px 0 0;
    padding: 12px 24px;
    margin-bottom: -2px;
}

.tab-btn.active {
    background: white;
    color: var(--cover-color);
    border-bottom: 2px solid var(--cover-color);
    transform: none;
}

.tab-content {
    display: none;
}

.tab-content.active {
    display: block;
}

.video-grid{
display: grid;
grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
gap: 25px;
}

.video-card{
background: white;
border: 1px solid var(--border);
border-radius: 20px;
overflow: hidden;
transition: 0.3s;
}

.video-card:hover{
transform: translateY(-2px);
box-shadow: 0 12px 25px rgba(15, 23, 42, 0.1);
}

.video-header{
padding: 14px 16px;
display: flex;
justify-content: space-between;
align-items: flex-start;
border-bottom: 1px solid var(--border);
}

.video-title{
font-size: 14px;
font-weight: 600;
line-height: 1.4;
flex: 1;
}

.comment-count{
background: var(--bg-secondary);
padding: 4px 12px;
border-radius: 30px;
font-size: 11px;
font-weight: 600;
}

.thumbnail-box{
display: block;
width: 100%;
height: 200px;
overflow: hidden;
}

.thumbnail-box img{
width: 100%;
height: 100%;
object-fit: cover;
transition: 0.3s;
}

.thumbnail-box:hover img{
transform: scale(1.03);
}

.comment-section{
padding: 16px;
max-height: 350px;
overflow-y: auto;
background: var(--bg-secondary);
}

.comment-item{
background: white;
border: 1px solid var(--border);
padding: 12px;
border-radius: 14px;
margin-bottom: 12px;
}

.comment-user{
display: flex;
align-items: center;
gap: 10px;
margin-bottom: 10px;
}

.comment-user img{
width: 36px;
height: 36px;
border-radius: 50%;
border: 1.5px solid var(--accent-info);
object-fit: cover;
}

.comment-name{
font-size: 13px;
font-weight: 700;
}

.comment-time{
font-size: 10px;
color: var(--text-muted);
margin-top: 3px;
}

.comment-text{
font-size: 12px;
line-height: 1.5;
color: var(--text-secondary);
}

.deleted-table-container {
    background: white;
    border: 1px solid var(--border);
    border-radius: 20px;
    overflow-x: auto;
}

.deleted-table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

.deleted-table th {
    background: var(--bg-secondary);
    padding: 14px 12px;
    text-align: left;
    font-weight: 600;
    border-bottom: 1px solid var(--border);
}

.deleted-table td {
    padding: 12px;
    border-bottom: 1px solid var(--border);
}

.badge-deleted {
    background: var(--accent-danger);
    color: white;
    padding: 2px 8px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 600;
}

.toast{
position: fixed;
top: 25px;
right: -400px;
width: 360px;
background: white;
border-left: 4px solid #10b981;
border-radius: 16px;
padding: 16px;
transition: 0.4s;
z-index: 999;
box-shadow: 0 10px 35px rgba(0,0,0,0.15);
}

.toast.show{
right: 25px;
}

.toast-text{
font-size: 13px;
color: var(--text-secondary);
}

@media(max-width: 768px){
body{padding:15px;}
.video-grid{grid-template-columns:1fr;}
.thumbnail-box{height:180px;}
button,input{width:100%;}
.toast{width:90%;right:-90%;}
}
</style>
</head>
<body>

<div class="bg-pattern"></div>

<div class="toast" id="toast">
<div class="toast-title">🔔 KOMENTAR BARU</div>
<div class="toast-text" id="toastText"></div>
</div>

<div class="container">
<div class="topbar">
<div class="logo">
KOMENTAR <span>NEGATIF YOUTUBE</span>
</div>
<div class="status-grid">
<div class="status-card"><div class="status-title">STATUS</div><div class="status-value online">● ONLINE</div></div>
<div class="status-card"><div class="status-title">TOTAL VIDEO</div><div class="status-value" id="totalVideos">0</div></div>
<div class="status-card"><div class="status-title">AUTO REFRESH</div><div class="status-value" id="refreshText">30 MENIT</div></div>
<div class="status-card"><div class="status-title">KOMENTAR DIHAPUS</div><div class="status-value" id="deletedCount">0</div></div>
</div>
</div>

<div class="setting-panel">
<div class="setting-row">
<input type="number" id="refreshInput" placeholder="Menit Refresh" value="30" min="1">
<button onclick="saveRefresh()">SIMPAN REFRESH</button>
<button onclick="manualRefresh()">REFRESH SEKARANG</button>

</div>
</div>

<div class="tabs">
<button class="tab-btn active" onclick="switchTab('monitor')">📺 MONITOR KOMENTAR</button>
<button class="tab-btn" onclick="switchTab('deleted')">🗑️ KOMENTAR YANG DIHAPUS</button>
</div>

<div id="monitorTab" class="tab-content active">
<div class="video-grid" id="videoGrid"></div>
</div>

<div id="deletedTab" class="tab-content">
<div class="deleted-table-container">
<table class="deleted-table">
<thead><tr><th>Waktu Dihapus</th><th>Pengguna</th><th>Komentar</th><th>Video</th><th>Status</th></tr></thead>
<tbody id="deletedTableBody"><tr><td colspan="5" style="text-align:center;padding:40px;">⏳ Memuat data dari Firebase......</td></tr>
</tbody>
</table>
</div>
</div>
</div>

<script>
// ==================== FIREBASE CONFIG ====================
const FIREBASE_URL = "https://monitor-5432a-default-rtdb.asia-southeast1.firebasedatabase.app/";
const API_KEY = "AIzaSyC0QKWbbW4M9_kRu2e0PQ3psM8RYXv4GDI";

const rawVideos = [
{ url: "https://youtu.be/dgiQObBtcOY", title: "PULITOTO - Tutorial Lengkap"},
{ url: "https://youtu.be/b18cWbAKIWw", title: "CARA DAFTAR AKUN BARU"},
{ url: "https://youtu.be/FwxvsPpT5hk", title: "CARA DEPOSIT VIA BANK & E-WALLET"},
{ url: "https://youtu.be/4TDTgBHmO4w", title: "CARA WITHDRAW SALDO KE REKENING"},
{ url: "https://youtu.be/e1y9fQzjISc", title: "DEPOSIT QRIS INSTANT"},
{ url: "https://youtu.be/XVHQZdBVowI", title: "CARIKAN ID USERNAME"},
{ url: "https://youtu.be/vjgSH6y7PQ0", title: "APK ANDROID - Install & Login"},
{ url: "https://youtu.be/vSoh5-Ecg2U", title: "APK IOS - Panduan Lengkap"}
];

function extractVideoId(url) {
    let match = url.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/);
    if(match) return match[1];
    match = url.match(/[?&]v=([a-zA-Z0-9_-]{11})/);
    if(match) return match[1];
    return null;
}

const videos = rawVideos.map(v => ({id: extractVideoId(v.url), title: v.title})).filter(v => v.id);
document.getElementById("totalVideos").innerText = videos.length;

let refreshMinutes = parseInt(localStorage.getItem("refreshMinutes")) || 30;
let refreshInterval;
let savedComments = {};
let savedCommentsDetail = {};
let deletedCommentsLog = [];
let isFirstLoad = true;

// ==================== SUARA CEWEK LEMBUT BAHASA INDONESIA ====================
let speechEnabled = true;
let speechSynthesis = window.speechSynthesis;
let notificationPermission = false;
let selectedVoice = null;

// Fungsi untuk mendapatkan suara cewek Indonesia yang lembut
function getIndonesianFemaleVoice() {
    const voices = speechSynthesis.getVoices();
    
    // Daftar prioritas suara cewek Indonesia (dari yang terbaik)
    const priorityList = [
        "Google Bahasa Indonesia",      // Google Assistant (cewek, lembut)
        "Microsoft Siti Online",        // Microsoft Siti (cewek Indonesia)
        "Google Bahasa Indonesia",      // alternatif
        "Siti",                         // Siti Indonesia
        "Female",                       // generic female
        "Perempuan"                     // generic perempuan
    ];
    
    // Cari suara yang match dengan prioritas
    for (const priority of priorityList) {
        const voice = voices.find(v => 
            (v.lang === "id-ID" || v.lang === "id") && 
            v.name.includes(priority)
        );
        if (voice) return voice;
    }
    
    // Fallback: cari suara dengan lang id-ID (Indonesia)
    const indonesianVoice = voices.find(v => v.lang === "id-ID");
    if (indonesianVoice) return indonesianVoice;
    
    // Fallback terakhir: cari suara female dengan bahasa apapun
    const femaleVoice = voices.find(v => 
        v.name.toLowerCase().includes("female") || 
        v.name.toLowerCase().includes("perempuan")
    );
    if (femaleVoice) return femaleVoice;
    
    // Default: suara pertama yang available
    return voices[0];
}

// Inisialisasi suara (panggil setelah voices loaded)
function initVoice() {
    const voices = speechSynthesis.getVoices();
    if (voices.length > 0) {
        selectedVoice = getIndonesianFemaleVoice();
        console.log("✅ Suara terpilih:", selectedVoice?.name, selectedVoice?.lang);
    }
}

// Load voices (karena kadang perlu waktu)
if (speechSynthesis) {
    speechSynthesis.onvoiceschanged = () => {
        initVoice();
    };
    // Coba langsung
    setTimeout(() => initVoice(), 500);
}

// Fungsi untuk mengucapkan teks dengan suara cewek lembut
function speakText(text) {
    if (!speechEnabled) return;
    
    try {
        // Hentikan suara yang sedang berlangsung
        if (speechSynthesis.speaking) {
            speechSynthesis.cancel();
        }
        
        const utterance = new SpeechSynthesisUtterance(text);
        utterance.lang = "id-ID"; // Bahasa Indonesia
        utterance.rate = 0.85;    // Sedikit lebih lambat (lembut)
        utterance.pitch = 1.15;   // Nada lebih tinggi (khas cewek)
        utterance.volume = 1.0;   // Volume maksimal
        
        // Gunakan suara cewek yang sudah dipilih
        if (selectedVoice) {
            utterance.voice = selectedVoice;
        } else {
            // Coba cari lagi suara cewek Indonesia
            const voices = speechSynthesis.getVoices();
            const femaleIndo = voices.find(v => 
                (v.lang === "id-ID" || v.lang === "id") && 
                (v.name.toLowerCase().includes("female") || v.name.toLowerCase().includes("google") || v.name.toLowerCase().includes("siti"))
            );
            if (femaleIndo) utterance.voice = femaleIndo;
        }
        
        speechSynthesis.speak(utterance);
        console.log(`🔊 (Suara cewek lembut) Mengucapkan: "${text}"`);
    } catch(e) {
        console.log("Speech error:", e);
        playFallbackBeep();
    }
}

// Fallback jika speech synthesis gagal
function playFallbackBeep() {
    try {
        const audioContext = new (window.AudioContext || window.webkitAudioContext)();
        if (audioContext.state === "suspended") {
            audioContext.resume();
        }
        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();
        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);
        oscillator.frequency.value = 880;
        gainNode.gain.value = 0.3;
        oscillator.start();
        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + 1);
        oscillator.stop(audioContext.currentTime + 0.8);
    } catch(e) {
        console.log("Beep fallback gagal");
    }
}

// Minta izin notifikasi
function requestNotificationPermission() {
    if ("Notification" in window) {
        if (Notification.permission === "default") {
            Notification.requestPermission().then(perm => {
                notificationPermission = perm === "granted";
                if (notificationPermission) console.log("✅ Notifikasi diizinkan");
            });
        } else if (Notification.permission === "granted") {
            notificationPermission = true;
        }
    }
}

// Tampilkan notifikasi desktop
function showDesktopNotification(title, body) {
    if (notificationPermission && "Notification" in window) {
        try {
            const notification = new Notification(title, {
                body: body,
                icon: "https://www.youtube.com/s/desktop/014d2e5f/img/favicon_144x144.png",
                silent: false
            });
            notification.onclick = () => {
                window.focus();
                notification.close();
            };
            setTimeout(() => notification.close(), 5000);
        } catch(e) {
            console.log("Notifikasi error:", e);
        }
    }
}

// Tampilkan notifikasi komentar baru DENGAN SUARA CEWEK LEMBUT
function showNewCommentNotification(username, videoTitle, commentText) {
    // 1. SUARA UCAPAN CEWEK LEMBUT: "SATU KOMENTAR NEGATIF YOUTUBE"
    speakText("SATU KOMENTAR NEGATIF YOUTUBE");
    
    // 2. Toast di dalam halaman
    const toast = document.getElementById("toast");
    document.getElementById("toastText").innerHTML = `💬 <strong>${escapeHtml(username)}</strong> berkomentar di <strong>${escapeHtml(videoTitle)}</strong><br><span style="font-size:11px;">${escapeHtml(commentText.substring(0,80))}${commentText.length>80?'...':''}</span>`;
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 5000);
    
    // 3. Notifikasi desktop
    showDesktopNotification(`💬 Komentar baru dari ${username}`, `${videoTitle}\n"${commentText.substring(0,100)}${commentText.length>100?'...':''}"`);
}

// Test suara (tombol TEST SUARA)
function testSound() {
    speakText("SATU KOMENTAR NEGATIF YOUTUBE");
    showToast("🔊 Test suara cewek lembut! Seharusnya terdengar 'SATU KOMENTAR NEGATIF YOUTUBE' dengan suara perempuan");
    
    // Test notifikasi desktop
    if (notificationPermission) {
        new Notification("Test Notifikasi", { body: "Notifikasi berfungsi dengan baik!" });
    } else {
        showToast("⚠️ Izin notifikasi belum diberikan. Klik izinkan saat popup muncul.");
        Notification.requestPermission();
    }
}

// Panggil minta izin saat halaman dimuat
requestNotificationPermission();

// Aktifkan Speech Synthesis (butuh interaksi user pertama)
function enableSpeech() {
    speechEnabled = true;
    if (speechSynthesis) {
        const dummy = new SpeechSynthesisUtterance("");
        speechSynthesis.speak(dummy);
        speechSynthesis.cancel();
    }
    console.log("✅ Speech diaktifkan");
}

setTimeout(() => enableSpeech(), 1000);

document.getElementById("refreshInput").value = refreshMinutes;
document.getElementById("refreshText").innerText = refreshMinutes + " MENIT";

function saveRefresh() {
    let val = parseInt(document.getElementById("refreshInput").value);
    if(isNaN(val) || val < 1) val = 1;
    refreshMinutes = val;
    localStorage.setItem("refreshMinutes", refreshMinutes);
    document.getElementById("refreshText").innerText = refreshMinutes + " MENIT";
    startAutoRefresh();
    showToast("✅ Refresh diatur ke " + refreshMinutes + " menit");
}

function startAutoRefresh() {
    if(refreshInterval) clearInterval(refreshInterval);
    refreshInterval = setInterval(() => loadAllComments(), refreshMinutes * 60 * 1000);
}

// ==================== FIREBASE SYNC ====================
async function loadHistoryFromFirebase() {
    try {
        const response = await fetch(`${FIREBASE_URL}deletedHistory.json`);
        const data = await response.json();
        
        if(data) {
            deletedCommentsLog = Object.values(data);
            deletedCommentsLog.sort((a,b) => b.timestamp - a.timestamp);
            updateDeletedCount();
            renderDeletedTable();
            console.log(`✅ Loaded ${deletedCommentsLog.length} history from Firebase`);
        } else {
            deletedCommentsLog = [];
            updateDeletedCount();
            renderDeletedTable();
        }
    } catch(e) {
        console.error("Gagal load dari Firebase:", e);
        showToast("⚠️ Gagal sync dari Firebase");
    }
}

async function addHistoryToFirebase(comment) {
    try {
        const newId = Date.now() + "_" + Math.random().toString(36).substr(2, 6);
        await fetch(`${FIREBASE_URL}deletedHistory/${newId}.json`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(comment)
        });
        console.log("✅ History saved to Firebase");
    } catch(e) {
        console.error("Gagal save ke Firebase:", e);
    }
}

async function clearAllHistory() {
    if(!confirm("⚠️ PERINGATAN: Ini akan menghapus SEMUA history untuk SEMUA pengguna! Yakin?")) return;
    
    try {
        await fetch(`${FIREBASE_URL}deletedHistory.json`, {
            method: 'PUT',
            body: JSON.stringify(null)
        });
        deletedCommentsLog = [];
        updateDeletedCount();
        renderDeletedTable();
        showToast("✅ Semua history telah dihapus dari Firebase");
    } catch(e) {
        showToast("❌ Gagal menghapus history");
    }
}

function updateDeletedCount() {
    document.getElementById("deletedCount").innerText = deletedCommentsLog.length;
}

function renderDeletedTable() {
    const tbody = document.getElementById("deletedTableBody");
    if(!tbody) return;
    
    if(deletedCommentsLog.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5" style="text-align:center;padding:40px;">✨ Belum ada komentar yang dihapus ✨</td></tr>';
        return;
    }
    
    tbody.innerHTML = deletedCommentsLog.map(log => `
        <tr>
            <td style="white-space:nowrap;">${escapeHtml(log.deletedAt)}</td>
            <td><strong>${escapeHtml(log.authorName)}</strong></td>
            <td style="max-width:300px;">${escapeHtml(log.commentText)}</td>
            <td style="max-width:250px;">${escapeHtml(log.videoTitle)}</td>
            <td><span class="badge-deleted">TERHAPUS</span></td>
        </tr>
    `).join('');
}

async function addDeletedCommentToFirebase(authorName, commentText, videoTitle, videoId, commentId) {
    const now = new Date();
    const formattedTime = now.toLocaleString('id-ID');
    
    const alreadyExists = deletedCommentsLog.some(log => log.commentId === commentId);
    if(alreadyExists) return;
    
    const newComment = {
        deletedAt: formattedTime,
        authorName: authorName,
        commentText: commentText,
        videoTitle: videoTitle,
        videoId: videoId,
        commentId: commentId,
        timestamp: now.getTime()
    };
    
    deletedCommentsLog.unshift(newComment);
    if(deletedCommentsLog.length > 500) deletedCommentsLog = deletedCommentsLog.slice(0, 500);
    
    updateDeletedCount();
    renderDeletedTable();
    await addHistoryToFirebase(newComment);
    showToast(`🗑️ Komentar dari ${authorName} dihapus dari YouTube & tersimpan di cloud`);
}

// ==================== LOAD COMMENTS ====================
async function loadAllComments() {
    const grid = document.getElementById("videoGrid");
    if(grid) grid.innerHTML = '<div style="text-align:center;padding:50px;">🔄 Memuat video...</div>';
    
    const promises = videos.map(video => loadVideoCard(video));
    const cards = await Promise.all(promises);
    
    if(grid) {
        grid.innerHTML = "";
        cards.forEach(card => { if(card) grid.appendChild(card); });
    }
}

async function loadVideoCard(video) {
    try {
        const apiUrl = `https://www.googleapis.com/youtube/v3/commentThreads?part=snippet&videoId=${video.id}&maxResults=10&order=time&key=${API_KEY}`;
        const response = await fetch(apiUrl);
        if(!response.ok) return createErrorCard(video);
        
        const data = await response.json();
        let commentsHTML = "";
        let totalComments = 0;
        const currentCommentIds = [];
        const currentCommentsMap = new Map();
        
        if(data.items && data.items.length > 0) {
            totalComments = data.items.length;
            for(const item of data.items) {
                const comment = item.snippet.topLevelComment.snippet;
                const commentId = item.snippet.topLevelComment.id;
                currentCommentIds.push(commentId);
                currentCommentsMap.set(commentId, {
                    authorName: comment.authorDisplayName,
                    commentText: comment.textDisplay
                });
                
                const oldList = savedComments[video.id] || [];
                if(!isFirstLoad && !oldList.includes(commentId)) {
                    // NOTIFIKASI KOMENTAR BARU dengan SUARA CEWEK LEMBUT
                    showNewCommentNotification(comment.authorDisplayName, video.title, comment.textDisplay);
                }
                
                commentsHTML += `
                    <div class="comment-item">
                        <div class="comment-user">
                            <img src="${comment.authorProfileImageUrl || 'https://ui-avatars.com/api/?background=0F172A&color=fff&name='+encodeURIComponent(comment.authorDisplayName?.charAt(0)||'U')}">
                            <div><div class="comment-name">${escapeHtml(comment.authorDisplayName)}</div>
                            <div class="comment-time">${new Date(comment.publishedAt).toLocaleString('id-ID')}</div></div>
                        </div>
                        <div class="comment-text">${escapeHtml(comment.textDisplay)}</div>
                    </div>
                `;
            }
        }
        
        const oldList = savedComments[video.id] || [];
        if(!isFirstLoad && oldList.length > 0) {
            for(const oldCommentId of oldList) {
                if(!currentCommentsMap.has(oldCommentId)) {
                    const oldDetail = savedCommentsDetail[video.id]?.[oldCommentId];
                    if(oldDetail) {
                        await addDeletedCommentToFirebase(oldDetail.authorName, oldDetail.commentText, video.title, video.id, oldCommentId);
                    }
                }
            }
        }
        
        if(!savedCommentsDetail[video.id]) savedCommentsDetail[video.id] = {};
        for(const [cid, detail] of currentCommentsMap) {
            savedCommentsDetail[video.id][cid] = detail;
        }
        savedComments[video.id] = currentCommentIds;
        
        const card = document.createElement("div");
        card.className = "video-card";
        card.innerHTML = `
            <div class="video-header">
                <div class="video-title">${escapeHtml(video.title)}</div>
                <div class="comment-count">💬 ${totalComments}</div>
            </div>
            <a href="https://www.youtube.com/watch?v=${video.id}" target="_blank" class="thumbnail-box">
                <img src="https://img.youtube.com/vi/${video.id}/maxresdefault.jpg" onerror="this.src='https://img.youtube.com/vi/${video.id}/hqdefault.jpg'">
            </a>
            <div class="comment-section">${commentsHTML || '<div style="padding:20px;text-align:center;">✨ Belum ada komentar ✨</div>'}</div>
        `;
        return card;
    } catch(e) {
        return createErrorCard(video);
    }
}

function createErrorCard(video) {
    const card = document.createElement("div");
    card.className = "video-card";
    card.innerHTML = `<div class="video-header"><div class="video-title">⚠️ ${escapeHtml(video.title)}</div><div class="comment-count">❌ Error</div></div>
        <div class="comment-section"><div style="padding:20px;text-align:center;">Gagal memuat komentar</div></div>`;
    return card;
}

function showToast(msg) {
    const toast = document.getElementById("toast");
    document.getElementById("toastText").innerHTML = escapeHtml(msg);
    toast.classList.add("show");
    setTimeout(() => toast.classList.remove("show"), 4000);
}

function escapeHtml(str) {
    if(!str) return "";
    return str.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
}

function manualRefresh() {
    loadAllComments();
    showToast("🔄 Memperbarui komentar...");
}

function switchTab(tab) {
    const monitor = document.getElementById("monitorTab");
    const deleted = document.getElementById("deletedTab");
    const btns = document.querySelectorAll(".tab-btn");
    btns.forEach(btn => btn.classList.remove("active"));
    if(tab === 'monitor') {
        monitor.classList.add("active");
        deleted.classList.remove("active");
        btns[0].classList.add("active");
    } else {
        monitor.classList.remove("active");
        deleted.classList.add("active");
        btns[1].classList.add("active");
        renderDeletedTable();
    }
}

async function silentLoadAll() {
    await loadHistoryFromFirebase();
    
    const grid = document.getElementById("videoGrid");
    if(grid) grid.innerHTML = '<div style="text-align:center;padding:50px;">⏳ Memuat video...</div>';
    
    const promises = videos.map(async (video) => {
        try {
            const apiUrl = `https://www.googleapis.com/youtube/v3/commentThreads?part=snippet&videoId=${video.id}&maxResults=10&order=time&key=${API_KEY}`;
            const response = await fetch(apiUrl);
            if(!response.ok) return createErrorCard(video);
            
            const data = await response.json();
            let commentsHTML = "";
            let totalComments = 0;
            const currentCommentIds = [];
            const currentCommentsMap = new Map();
            
            if(data.items && data.items.length > 0) {
                totalComments = data.items.length;
                for(const item of data.items) {
                    const comment = item.snippet.topLevelComment.snippet;
                    const commentId = item.snippet.topLevelComment.id;
                    currentCommentIds.push(commentId);
                    currentCommentsMap.set(commentId, {
                        authorName: comment.authorDisplayName,
                        commentText: comment.textDisplay
                    });
                    commentsHTML += `
                        <div class="comment-item">
                            <div class="comment-user">
                                <img src="${comment.authorProfileImageUrl || 'https://ui-avatars.com/api/?background=0F172A&color=fff&name='+encodeURIComponent(comment.authorDisplayName?.charAt(0)||'U')}">
                                <div><div class="comment-name">${escapeHtml(comment.authorDisplayName)}</div>
                                <div class="comment-time">${new Date(comment.publishedAt).toLocaleString('id-ID')}</div></div>
                            </div>
                            <div class="comment-text">${escapeHtml(comment.textDisplay)}</div>
                        </div>
                    `;
                }
            }
            
            if(!savedCommentsDetail[video.id]) savedCommentsDetail[video.id] = {};
            for(const [cid, detail] of currentCommentsMap) {
                savedCommentsDetail[video.id][cid] = detail;
            }
            savedComments[video.id] = currentCommentIds;
            
            const card = document.createElement("div");
            card.className = "video-card";
            card.innerHTML = `
                <div class="video-header">
                    <div class="video-title">${escapeHtml(video.title)}</div>
                    <div class="comment-count">💬 ${totalComments}</div>
                </div>
                <a href="https://www.youtube.com/watch?v=${video.id}" target="_blank" class="thumbnail-box">
                    <img src="https://img.youtube.com/vi/${video.id}/maxresdefault.jpg" onerror="this.src='https://img.youtube.com/vi/${video.id}/hqdefault.jpg'">
                </a>
                <div class="comment-section">${commentsHTML || '<div style="padding:20px;text-align:center;">✨ Belum ada komentar ✨</div>'}</div>
            `;
            return card;
        } catch(e) {
            return createErrorCard(video);
        }
    });
    
    const cards = await Promise.all(promises);
    if(grid) {
        grid.innerHTML = "";
        cards.forEach(c => grid.appendChild(c));
    }
    isFirstLoad = false;
}

// START
silentLoadAll();
startAutoRefresh();

window.saveRefresh = saveRefresh;
window.manualRefresh = manualRefresh;
window.clearAllHistory = clearAllHistory;
window.switchTab = switchTab;
window.testSound = testSound;
</script>
