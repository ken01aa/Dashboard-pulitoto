<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>JOB CS LINE - Auto Save</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at 10% 30%, #eef2f9, #d9e2ef);
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        .glass-header {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 1.2rem 2rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255,255,245,0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .title-section h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0B2B40, #1A4A5F);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .badge-date {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 0.6rem 1.3rem;
            border-radius: 2rem;
            color: white;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .shifts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }

        .shift-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s;
            border: 1px solid rgba(255,255,250,0.8);
        }

        .shift-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 28px 32px -12px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            padding: 1.5rem 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .shift-title {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .shift-icon {
            font-size: 2.2rem;
        }

        .shift-name {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .badge-shift {
            font-size: 0.7rem;
            background: #ffffffaa;
            backdrop-filter: blur(2px);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-weight: 700;
            color: #1e293b;
        }

        .task-count {
            background: rgba(0,0,0,0.05);
            padding: 0.4rem 1.1rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        .add-task-form {
            padding: 1.2rem 1.5rem;
            background: #f9fbfe;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #e9edf2;
        }

        .add-task-form input {
            flex: 1;
            border: 1.5px solid #e2e8f0;
            border-radius: 2rem;
            padding: 0.8rem 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            outline: none;
            transition: all 0.2s;
            background: white;
        }

        .add-task-form input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }

        .btn-add {
            background: #0f2c39;
            border: none;
            color: white;
            padding: 0 1.6rem;
            border-radius: 2rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn-add:hover {
            background: #083344;
            transform: scale(0.96);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        .task-list-container {
            padding: 1.2rem 1.2rem 1.8rem;
            max-height: 480px;
            overflow-y: auto;
        }

        .task-item {
            background: white;
            border-radius: 1.2rem;
            padding: 0.9rem 1.2rem;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 8px rgba(0,0,0,0.02);
            border: 1px solid #edf2f7;
            transition: all 0.25s ease;
            animation: fadeSlideIn 0.3s ease-out;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-item:hover {
            border-color: #cbd5e1;
            background: #fefefe;
            transform: translateX(6px);
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        .task-check {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #0f5c6e;
        }

        .task-text {
            font-size: 0.98rem;
            font-weight: 500;
            color: #0f172a;
            word-break: break-word;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .task-actions {
            display: flex;
            gap: 12px;
        }

        .edit-btn, .delete-btn {
            background: transparent;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.15s;
            color: #64748b;
        }

        .edit-btn:hover { color: #0284c7; transform: scale(1.15);}
        .delete-btn:hover { color: #dc2626; transform: scale(1.15);}

        .empty-message {
            text-align: center;
            padding: 2rem;
            color: #5b6e8c;
            font-style: italic;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 1.8rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.3);
            animation: zoomIn 0.2s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h3 {
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .modal-content input {
            width: 100%;
            padding: 0.8rem;
            border-radius: 2rem;
            border: 1px solid #ccc;
            margin-bottom: 1rem;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .modal-buttons button {
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .save-edit {
            background: #0f5c6e;
            color: white;
        }

        .cancel-edit {
            background: #e2e8f0;
        }

        .toast-notif {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293bdd;
            backdrop-filter: blur(12px);
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            z-index: 1100;
            opacity: 0;
            transition: all 0.25s ease;
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast-notif.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 850px) {
            .shifts-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            body {
                padding: 1rem;
            }
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.75rem;
            color: #2c3e50;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="glass-header">
        <div class="title-section">
            <h1><i class="fas fa-headset"></i> JOB CS LINE</h1>
        </div>
        <div class="badge-date">
            <i class="far fa-calendar-alt"></i>
            <span id="liveDate"></span>
        </div>
    </div>

    <div class="shifts-grid">
        <div class="shift-card">
            <div class="card-header" style="background: linear-gradient(115deg, #FEF3C7, #FFE4A3);">
                <div class="shift-title">
                    <div class="shift-icon"><i class="fas fa-sun"></i></div>
                    <div class="shift-name">Shift Pagi</div>
                    <span class="badge-shift"><i class="far fa-clock"></i> 07.45 – 19.45</span>
                </div>
                <div class="task-count" id="morningCount">0 tugas</div>
            </div>
            <div class="add-task-form">
                <input type="text" id="morningInput" placeholder="+ Tambah jobdesk CS pagi ..." autocomplete="off">
                <button class="btn-add" id="btnMorningAdd"><i class="fas fa-plus-circle"></i> Tambah</button>
            </div>
            <div class="task-list-container" id="morningList"></div>
        </div>

        <div class="shift-card">
            <div class="card-header" style="background: linear-gradient(115deg, #C9E9FF, #ADD8FF);">
                <div class="shift-title">
                    <div class="shift-icon"><i class="fas fa-moon"></i></div>
                    <div class="shift-name">Shift Malam</div>
                    <span class="badge-shift"><i class="far fa-clock"></i> 19.45 – 07.45</span>
                </div>
                <div class="task-count" id="nightCount">0 tugas</div>
            </div>
            <div class="add-task-form">
                <input type="text" id="nightInput" placeholder="+ Tambah jobdesk CS malam ..." autocomplete="off">
                <button class="btn-add" id="btnNightAdd"><i class="fas fa-plus-circle"></i> Tambah</button>
            </div>
            <div class="task-list-container" id="nightList"></div>
        </div>
    </div>
    <footer>
        <i class="fas fa-save"></i> Auto save otomatis (Tambah/Hapus/Edit/Centang) • Data tetap setelah refresh
    </footer>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-pen-fancy"></i> Edit Jobdesk</h3>
        <input type="text" id="editInput" placeholder="Ubah deskripsi tugas ...">
        <div class="modal-buttons">
            <button class="cancel-edit" id="cancelEditBtn">Batal</button>
            <button class="save-edit" id="saveEditBtn">Simpan</button>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-notif"><i class="fas fa-check-circle"></i> <span>Berhasil</span></div>

<script>
    // ==================== DATA ====================
    let tasksData = {
        morning: [],
        night: []
    };

    // ==================== FUNGSI DASAR ====================
    function generateId() {
        return Date.now() + '-' + Math.random().toString(36).substr(2, 8);
    }

    function showToast(message, icon = 'fa-check-circle') {
        const toast = document.getElementById('toastMsg');
        toast.innerHTML = `<i class="fas ${icon}"></i> <span>${message}</span>`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    function burstConfetti() {
        canvasConfetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, startVelocity: 15, colors: ['#0f5c6e', '#f59e0b', '#3b82f6'] });
        canvasConfetti({ particleCount: 40, spread: 100, origin: { y: 0.5, x: 0.3 }, startVelocity: 20 });
    }

    // ==================== LOCALSTORAGE (AUTO SAVE) ====================
    function saveToLocalStorage() {
        localStorage.setItem('jobCSLine_data', JSON.stringify(tasksData));
        console.log("✅ Data auto saved:", tasksData);
    }

    function loadFromLocalStorage() {
        const stored = localStorage.getItem('jobCSLine_data');
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (parsed && typeof parsed === 'object' && parsed.morning && parsed.night) {
                    tasksData = parsed;
                    console.log("📀 Data loaded from storage:", tasksData);
                    return true;
                }
            } catch(e) { console.error("Gagal parse storage:", e); }
        }
        return false;
    }

    // ==================== RENDER UI ====================
    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>]/g, function(m) {
            if (m === '&') return '&amp;';
            if (m === '<') return '&lt;';
            if (m === '>') return '&gt;';
            return m;
        });
    }

    function renderShift(shift) {
        const container = document.getElementById(`${shift}List`);
        const countSpan = document.getElementById(`${shift}Count`);
        if (!container) return;

        const tasks = tasksData[shift];
        const total = tasks.length;
        const completedCount = tasks.filter(t => t.completed).length;
        countSpan.innerText = `${total} tugas • ${completedCount} selesai`;

        if (total === 0) {
            const icon = shift === 'morning' ? 'fa-sun' : 'fa-moon';
            container.innerHTML = `<div class="empty-message"><i class="fas ${icon}"></i> Kosong, tambah jobdesk</div>`;
            return;
        }

        let html = '';
        tasks.forEach(task => {
            const completedClass = task.completed ? 'completed' : '';
            const checkedAttr = task.completed ? 'checked' : '';
            html += `
                <div class="task-item" data-id="${task.id}">
                    <div class="task-info">
                        <input type="checkbox" class="task-check" data-shift="${shift}" data-id="${task.id}" ${checkedAttr}>
                        <span class="task-text ${completedClass}">${escapeHtml(task.text)}</span>
                    </div>
                    <div class="task-actions">
                        <button class="edit-btn" data-shift="${shift}" data-id="${task.id}"><i class="fas fa-edit"></i></button>
                        <button class="delete-btn" data-shift="${shift}" data-id="${task.id}"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function renderAll() {
        renderShift('morning');
        renderShift('night');
    }

    // ==================== CRUD + AUTO SAVE ====================
    function addTask(shift, text) {
        if (!text.trim()) {
            showToast("Jobdesk tidak boleh kosong!", "fa-exclamation-triangle");
            return false;
        }
        const newTask = {
            id: generateId(),
            text: text.trim(),
            completed: false
        };
        tasksData[shift].push(newTask);
        saveToLocalStorage();  // ← AUTO SAVE
        renderAll();
        showToast(`✅ Jobdesk ditambahkan di ${shift === 'morning' ? 'Pagi' : 'Malam'}`, "fa-plus-circle");
        
        // scroll ke bawah
        const listDiv = document.getElementById(`${shift}List`);
        if (listDiv) listDiv.scrollTop = listDiv.scrollHeight;
        return true;
    }

    function deleteTask(shift, taskId) {
        const beforeLength = tasksData[shift].length;
        tasksData[shift] = tasksData[shift].filter(t => t.id !== taskId);
        if (beforeLength !== tasksData[shift].length) {
            saveToLocalStorage();  // ← AUTO SAVE (WAJIB)
            renderAll();
            showToast("🗑 Tugas berhasil dihapus", "fa-trash-alt");
        }
    }

    function toggleComplete(shift, taskId, isChecked) {
        const task = tasksData[shift].find(t => t.id === taskId);
        if (task) {
            task.completed = isChecked;
            saveToLocalStorage();  // ← AUTO SAVE
            renderAll();
            if (isChecked) {
                burstConfetti();
                showToast("🎉 Selamat! Tugas selesai 🎉", "fa-trophy");
            } else {
                showToast("Tugas dibatalkan selesai", "fa-undo-alt");
            }
        }
    }

    function editTask(shift, taskId, newText) {
        if (!newText.trim()) {
            showToast("Text tidak boleh kosong!", "fa-exclamation");
            return false;
        }
        const task = tasksData[shift].find(t => t.id === taskId);
        if (task) {
            task.text = newText.trim();
            saveToLocalStorage();  // ← AUTO SAVE
            renderAll();
            showToast("✏️ Jobdesk diperbarui", "fa-pen");
            return true;
        }
        return false;
    }

    // ==================== EVENT LISTENER (DELEGASI) ====================
    function attachGlobalEvents() {
        // Morning add
        const btnMorning = document.getElementById('btnMorningAdd');
        const morningInput = document.getElementById('morningInput');
        if (btnMorning) {
            btnMorning.onclick = () => addTask('morning', morningInput.value) && (morningInput.value = '');
        }
        if (morningInput) {
            morningInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTask('morning', morningInput.value) && (morningInput.value = '');
            });
        }

        // Night add
        const btnNight = document.getElementById('btnNightAdd');
        const nightInput = document.getElementById('nightInput');
        if (btnNight) {
            btnNight.onclick = () => addTask('night', nightInput.value) && (nightInput.value = '');
        }
        if (nightInput) {
            nightInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTask('night', nightInput.value) && (nightInput.value = '');
            });
        }

        // Event delegation untuk checkbox, edit, delete (karena dynamic)
        document.body.addEventListener('change', (e) => {
            if (e.target.classList.contains('task-check')) {
                const shift = e.target.getAttribute('data-shift');
                const id = e.target.getAttribute('data-id');
                const isChecked = e.target.checked;
                if (shift && id) toggleComplete(shift, id, isChecked);
            }
        });

        document.body.addEventListener('click', (e) => {
            // Hapus
            if (e.target.closest('.delete-btn')) {
                const btn = e.target.closest('.delete-btn');
                const shift = btn.getAttribute('data-shift');
                const id = btn.getAttribute('data-id');
                if (shift && id) deleteTask(shift, id);
            }
            // Edit
            if (e.target.closest('.edit-btn')) {
                const btn = e.target.closest('.edit-btn');
                const shift = btn.getAttribute('data-shift');
                const id = btn.getAttribute('data-id');
                if (shift && id) openEditModal(shift, id);
            }
        });
    }

    // ==================== MODAL EDIT ====================
    let currentEditShift = null;
    let currentEditId = null;

    function openEditModal(shift, taskId) {
        const task = tasksData[shift].find(t => t.id === taskId);
        if (!task) return;
        currentEditShift = shift;
        currentEditId = taskId;
        const modal = document.getElementById('editModal');
        const input = document.getElementById('editInput');
        input.value = task.text;
        modal.style.display = 'flex';
    }

    function closeModal() {
        document.getElementById('editModal').style.display = 'none';
        currentEditShift = null;
        currentEditId = null;
    }

    function confirmEdit() {
        if (!currentEditShift || !currentEditId) {
            closeModal();
            return;
        }
        const newText = document.getElementById('editInput').value;
        editTask(currentEditShift, currentEditId, newText);
        closeModal();
    }

    // ==================== INIT DEMO & LOAD ====================
    function initDemoData() {
        tasksData.morning = [
            { id: generateId(), text: "📞 Menjawab telepon customer (07.45 - 10.00)", completed: false },
            { id: generateId(), text: "💬 Membalas chat WhatsApp & email", completed: false },
            { id: generateId(), text: "📝 Input keluhan ke sistem", completed: true },
            { id: generateId(), text: "🔄 Koordinasi dengan teknisi lapangan", completed: false },
            { id: generateId(), text: "📊 Laporan CS shift pagi", completed: false }
        ];
        tasksData.night = [
            { id: generateId(), text: "🌙 Follow up tiket malam (19.45 - 22.00)", completed: false },
            { id: generateId(), text: "🔒 Cek kepuasan pelanggan via broadcast", completed: false },
            { id: generateId(), text: "📋 Rekap masalah darurat", completed: true },
            { id: generateId(), text: "☎️ Layanan hotline 24 jam", completed: false },
            { id: generateId(), text: "📑 Serah terima ke shift pagi", completed: false }
        ];
        saveToLocalStorage();
        renderAll();
    }

    function updateLiveDate() {
        const now = new Date();
        const formatted = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        const span = document.getElementById('liveDate');
        if (span) span.innerHTML = `<i class="far fa-calendar-check"></i> ${formatted}`;
    }

    // ==================== START APLIKASI ====================
    function startApp() {
        const hasData = loadFromLocalStorage();
        if (!hasData || (tasksData.morning.length === 0 && tasksData.night.length === 0)) {
            initDemoData();
        } else {
            renderAll();
        }
        attachGlobalEvents();
        updateLiveDate();
        setInterval(updateLiveDate, 60000);

        // Modal buttons
        document.getElementById('saveEditBtn').onclick = confirmEdit;
        document.getElementById('cancelEditBtn').onclick = closeModal;
        window.onclick = (e) => { if (e.target === document.getElementById('editModal')) closeModal(); };
        
        console.log("🔥 JOB CS LINE - Auto save siap, hapus akan tersimpan permanen");
    }

    startApp();
</script>
</body>
</html>
