<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>JOB CS LINE - ShiftFlow Pro</title>
    <!-- Google Fonts & Font Awesome 6 -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <!-- Canvas Confetti library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: radial-gradient(circle at 10% 30%, #eef2f9, #d9e2ef);
            min-height: 100vh;
            padding: 2rem 1.5rem;
        }

        .app-container {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Glass header keren */
        .glass-header {
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(16px);
            border-radius: 2rem;
            padding: 1.2rem 2rem;
            margin-bottom: 2.5rem;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(255,255,245,0.6);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .title-section h1 {
            font-size: 2rem;
            font-weight: 800;
            background: linear-gradient(135deg, #0B2B40, #1A4A5F);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
        }

        .badge-date {
            background: rgba(0, 0, 0, 0.65);
            backdrop-filter: blur(8px);
            padding: 0.6rem 1.3rem;
            border-radius: 2rem;
            color: white;
            font-weight: 500;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* Grid dua kolom */
        .shifts-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2rem;
        }

        /* Card premium */
        .shift-card {
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(4px);
            border-radius: 2rem;
            box-shadow: 0 20px 35px -12px rgba(0, 0, 0, 0.2);
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s;
            border: 1px solid rgba(255,255,250,0.8);
        }

        .shift-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 28px 32px -12px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            padding: 1.5rem 1.8rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .shift-title {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .shift-icon {
            font-size: 2.2rem;
        }

        .shift-name {
            font-size: 1.7rem;
            font-weight: 800;
            letter-spacing: -0.3px;
        }

        .badge-shift {
            font-size: 0.7rem;
            background: #ffffffaa;
            backdrop-filter: blur(2px);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-weight: 700;
            color: #1e293b;
        }

        .task-count {
            background: rgba(0,0,0,0.05);
            padding: 0.4rem 1.1rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.8rem;
        }

        /* Form tambah tugas */
        .add-task-form {
            padding: 1.2rem 1.5rem;
            background: #f9fbfe;
            display: flex;
            gap: 12px;
            border-bottom: 1px solid #e9edf2;
        }

        .add-task-form input {
            flex: 1;
            border: 1.5px solid #e2e8f0;
            border-radius: 2rem;
            padding: 0.8rem 1rem;
            font-size: 0.9rem;
            font-weight: 500;
            outline: none;
            transition: all 0.2s;
            background: white;
        }

        .add-task-form input:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,0.15);
        }

        .btn-add {
            background: #0f2c39;
            border: none;
            color: white;
            padding: 0 1.6rem;
            border-radius: 2rem;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn-add:hover {
            background: #083344;
            transform: scale(0.96);
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }

        /* Task list */
        .task-list-container {
            padding: 1.2rem 1.2rem 1.8rem;
            max-height: 480px;
            overflow-y: auto;
        }

        .task-item {
            background: white;
            border-radius: 1.2rem;
            padding: 0.9rem 1.2rem;
            margin-bottom: 0.8rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 3px 8px rgba(0,0,0,0.02);
            border: 1px solid #edf2f7;
            transition: all 0.25s ease;
            animation: fadeSlideIn 0.3s ease-out;
        }

        @keyframes fadeSlideIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .task-item:hover {
            border-color: #cbd5e1;
            background: #fefefe;
            transform: translateX(6px);
        }

        .task-info {
            display: flex;
            align-items: center;
            gap: 14px;
            flex: 1;
        }

        .task-check {
            width: 22px;
            height: 22px;
            cursor: pointer;
            accent-color: #0f5c6e;
            transition: transform 0.1s;
        }
        .task-check:active {
            transform: scale(1.1);
        }

        .task-text {
            font-size: 0.98rem;
            font-weight: 500;
            color: #0f172a;
            word-break: break-word;
            transition: 0.2s;
        }

        .task-text.completed {
            text-decoration: line-through;
            color: #94a3b8;
        }

        .task-actions {
            display: flex;
            gap: 12px;
        }

        .edit-btn, .delete-btn {
            background: transparent;
            border: none;
            font-size: 1.1rem;
            cursor: pointer;
            transition: 0.15s;
            color: #64748b;
        }

        .edit-btn:hover { color: #0284c7; transform: scale(1.15);}
        .delete-btn:hover { color: #dc2626; transform: scale(1.15);}

        .empty-message {
            text-align: center;
            padding: 2rem;
            color: #5b6e8c;
            font-style: italic;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        /* Modal Edit */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: white;
            padding: 2rem;
            border-radius: 1.8rem;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 40px rgba(0,0,0,0.3);
            animation: zoomIn 0.2s ease;
        }

        @keyframes zoomIn {
            from { transform: scale(0.95); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .modal-content h3 {
            margin-bottom: 1rem;
            font-weight: 700;
        }

        .modal-content input {
            width: 100%;
            padding: 0.8rem;
            border-radius: 2rem;
            border: 1px solid #ccc;
            margin-bottom: 1rem;
        }

        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
        }

        .modal-buttons button {
            padding: 0.5rem 1.2rem;
            border-radius: 2rem;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .save-edit {
            background: #0f5c6e;
            color: white;
        }

        .cancel-edit {
            background: #e2e8f0;
        }

        /* Toast notification */
        .toast-notif {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(20px);
            background: #1e293bdd;
            backdrop-filter: blur(12px);
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-weight: 500;
            font-size: 0.85rem;
            z-index: 1100;
            opacity: 0;
            transition: all 0.25s ease;
            pointer-events: none;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .toast-notif.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 850px) {
            .shifts-grid {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
            body {
                padding: 1rem;
            }
        }

        footer {
            text-align: center;
            margin-top: 3rem;
            font-size: 0.75rem;
            color: #2c3e50;
            opacity: 0.7;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="glass-header">
        <div class="title-section">
            <h1><i class="fas fa-headset"></i> JOB CS LINE</h1>
        </div>
        <div class="badge-date">
            <i class="far fa-calendar-alt"></i>
            <span id="liveDate"></span>
        </div>
    </div>

    <div class="shifts-grid">
        <!-- SHIFT PAGI -->
        <div class="shift-card" data-shift="morning">
            <div class="card-header" style="background: linear-gradient(115deg, #FEF3C7, #FFE4A3);">
                <div class="shift-title">
                    <div class="shift-icon"><i class="fas fa-sun fa-fw"></i></div>
                    <div class="shift-name">Shift Pagi</div>
                    <span class="badge-shift"><i class="far fa-clock"></i> 07.45 – 19.45</span>
                </div>
                <div class="task-count" id="morningCount">0 tugas</div>
            </div>
            <div class="add-task-form">
                <input type="text" id="morningInput" placeholder="+ Tambah jobdesk CS pagi ..." autocomplete="off">
                <button class="btn-add" onclick="addTask('morning')"><i class="fas fa-plus-circle"></i> Tambah</button>
            </div>
            <div class="task-list-container" id="morningList">
                <div class="empty-message"><i class="fas fa-coffee"></i> Belum ada jobdesk Shift Pagi</div>
            </div>
        </div>

        <!-- SHIFT MALAM -->
        <div class="shift-card" data-shift="night">
            <div class="card-header" style="background: linear-gradient(115deg, #C9E9FF, #ADD8FF);">
                <div class="shift-title">
                    <div class="shift-icon"><i class="fas fa-moon fa-fw"></i></div>
                    <div class="shift-name">Shift Malam</div>
                    <span class="badge-shift"><i class="far fa-clock"></i> 19.45 – 07.45</span>
                </div>
                <div class="task-count" id="nightCount">0 tugas</div>
            </div>
            <div class="add-task-form">
                <input type="text" id="nightInput" placeholder="+ Tambah jobdesk CS malam ..." autocomplete="off">
                <button class="btn-add" onclick="addTask('night')"><i class="fas fa-plus-circle"></i> Tambah</button>
            </div>
            <div class="task-list-container" id="nightList">
                <div class="empty-message"><i class="fas fa-star-of-life"></i> Belum ada jobdesk Shift Malam</div>
            </div>
        </div>
    </div>
    <footer>
        <i class="fas fa-save"></i> Auto-save otomatis • <i class="fas fa-magic"></i> Efek confetti selesai
    </footer>
</div>

<!-- Modal Edit -->
<div id="editModal" class="modal">
    <div class="modal-content">
        <h3><i class="fas fa-pen-fancy"></i> Edit Jobdesk</h3>
        <input type="text" id="editInput" placeholder="Ubah deskripsi tugas ...">
        <div class="modal-buttons">
            <button class="cancel-edit" onclick="closeModal()">Batal</button>
            <button class="save-edit" onclick="confirmEdit()">Simpan</button>
        </div>
    </div>
</div>

<div id="toastMsg" class="toast-notif"><i class="fas fa-check-circle"></i> <span>Berhasil</span></div>

<script>
    let tasksData = { morning: [], night: [] };

    function generateId() {
        return `${Date.now()}-${Math.random().toString(36).substr(2, 10)}`;
    }

    // Toast manis
    function showToast(message, icon = 'fa-check-circle') {
        const toast = document.getElementById('toastMsg');
        toast.innerHTML = `<i class="fas ${icon}"></i> <span>${message}</span>`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Confetti celebration
    function burstConfetti() {
        canvasConfetti({ particleCount: 100, spread: 70, origin: { y: 0.6 }, startVelocity: 15, colors: ['#0f5c6e', '#f59e0b', '#3b82f6'] });
        canvasConfetti({ particleCount: 40, spread: 100, origin: { y: 0.5, x: 0.3 }, startVelocity: 20 });
    }

    // LocalStorage
    function loadFromStorage() {
        const stored = localStorage.getItem('shiftFlowPro_data');
        if (stored) {
            try {
                const parsed = JSON.parse(stored);
                if (parsed.morning && parsed.night) tasksData = parsed;
            } catch(e) {}
        }
    }
    function saveToStorage() {
        localStorage.setItem('shiftFlowPro_data', JSON.stringify(tasksData));
    }

    function escapeHtml(str) {
        return str.replace(/[&<>]/g, function(m) {
            if(m === '&') return '&amp;';
            if(m === '<') return '&lt;';
            if(m === '>') return '&gt;';
            return m;
        });
    }

    function renderShift(shift) {
        const container = document.getElementById(`${shift}List`);
        const countSpan = document.getElementById(`${shift}Count`);
        if (!container) return;
        const tasks = tasksData[shift];
        const total = tasks.length;
        const completedCount = tasks.filter(t => t.completed).length;
        countSpan.innerText = `${total} tugas • ${completedCount} selesai`;

        if (total === 0) {
            const icon = shift === 'morning' ? 'fa-sun' : 'fa-moon';
            container.innerHTML = `<div class="empty-message"><i class="fas ${icon}"></i> Kosong, tambah jobdesk</div>`;
            return;
        }

        let itemsHtml = '';
        tasks.forEach(task => {
            const completedClass = task.completed ? 'completed' : '';
            const checkedAttr = task.completed ? 'checked' : '';
            itemsHtml += `
                <div class="task-item" data-id="${task.id}">
                    <div class="task-info">
                        <input type="checkbox" class="task-check" data-id="${task.id}" data-shift="${shift}" ${checkedAttr} onchange="toggleComplete('${shift}', '${task.id}', this.checked)">
                        <span class="task-text ${completedClass}">${escapeHtml(task.text)}</span>
                    </div>
                    <div class="task-actions">
                        <button class="edit-btn" onclick="openEditModal('${shift}', '${task.id}')"><i class="fas fa-edit"></i></button>
                        <button class="delete-btn" onclick="deleteTask('${shift}', '${task.id}')"><i class="fas fa-trash-alt"></i></button>
                    </div>
                </div>
            `;
        });
        container.innerHTML = itemsHtml;
    }

    function renderAll() {
        renderShift('morning');
        renderShift('night');
        saveToStorage();
    }

    window.addTask = function(shift) {
        const inputElem = document.getElementById(`${shift}Input`);
        const rawText = inputElem.value.trim();
        if (rawText === "") {
            showToast("Jobdesk tidak boleh kosong!", "fa-exclamation-triangle");
            return;
        }
        const newTask = { id: generateId(), text: rawText, completed: false };
        tasksData[shift].push(newTask);
        inputElem.value = "";
        renderAll();
        showToast(`✅ Jobdesk ditambahkan di ${shift === 'morning' ? 'Pagi' : 'Malam'}`, "fa-plus-circle");
        // scroll
        const listDiv = document.getElementById(`${shift}List`);
        if(listDiv) listDiv.scrollTop = listDiv.scrollHeight;
    }

    window.deleteTask = function(shift, taskId) {
        tasksData[shift] = tasksData[shift].filter(t => t.id !== taskId);
        renderAll();
        showToast("🗑 Tugas dihapus", "fa-trash-alt");
    }

    window.toggleComplete = function(shift, taskId, isChecked) {
        const task = tasksData[shift].find(t => t.id === taskId);
        if (task) {
            task.completed = isChecked;
            renderAll();
            if (isChecked) {
                burstConfetti();
                showToast("✨ Selamat! Tugas selesai ✨", "fa-trophy");
            } else {
                showToast("Tugas belum selesai", "fa-undo-alt");
            }
        }
    }

    // Modal logic
    let currentEdit = { shift: null, taskId: null };
    window.openEditModal = function(shift, taskId) {
        const task = tasksData[shift].find(t => t.id === taskId);
        if (!task) return;
        currentEdit = { shift, taskId };
        document.getElementById('editInput').value = task.text;
        document.getElementById('editModal').style.display = 'flex';
    }
    window.closeModal = function() {
        document.getElementById('editModal').style.display = 'none';
        currentEdit = { shift: null, taskId: null };
    }
    window.confirmEdit = function() {
        if (!currentEdit.shift || !currentEdit.taskId) { closeModal(); return; }
        const newText = document.getElementById('editInput').value.trim();
        if (newText === "") { showToast("Teks tidak boleh kosong!", "fa-exclamation"); return; }
        const task = tasksData[currentEdit.shift].find(t => t.id === currentEdit.taskId);
        if (task) {
            task.text = newText;
            renderAll();
            showToast("✏️ Jobdesk diperbarui", "fa-pen");
        }
        closeModal();
    }
    window.onclick = function(e) { if (e.target === document.getElementById('editModal')) closeModal(); }

    // Tanggal live
    function updateLiveDate() {
        const now = new Date();
        const formatted = now.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
        document.getElementById('liveDate').innerHTML = `<i class="far fa-calendar-check"></i> ${formatted}`;
    }

    // Data demo CS line
    function initDemoData() {
        if (tasksData.morning.length === 0 && tasksData.night.length === 0) {
            tasksData.morning = [
                { id: generateId(), text: "📞 Menjawab telepon customer (07.45 - 10.00)", completed: false },
                { id: generateId(), text: "💬 Membalas chat WhatsApp & email", completed: false },
                { id: generateId(), text: "📝 Input keluhan ke sistem", completed: true },
                { id: generateId(), text: "🔄 Koordinasi dengan teknisi lapangan", completed: false },
                { id: generateId(), text: "📊 Laporan CS shift pagi", completed: false }
            ];
            tasksData.night = [
                { id: generateId(), text: "🌙 Follow up tiket malam (19.45 - 22.00)", completed: false },
                { id: generateId(), text: "🔒 Cek kepuasan pelanggan via broadcast", completed: false },
                { id: generateId(), text: "📋 Rekap masalah darurat", completed: true },
                { id: generateId(), text: "☎️ Layanan hotline 24 jam", completed: false },
                { id: generateId(), text: "📑 Serah terima ke shift pagi", completed: false }
            ];
            renderAll();
        }
    }

    // Binding enter
    function bindEnter() {
        document.getElementById('morningInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') addTask('morning'); });
        document.getElementById('nightInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') addTask('night'); });
    }

    loadFromStorage();
    if (!tasksData.morning || !tasksData.night) tasksData = { morning: [], night: [] };
    if (tasksData.morning.length === 0 && tasksData.night.length === 0) initDemoData();
    else renderAll();

    bindEnter();
    updateLiveDate();
    setInterval(updateLiveDate, 60000);
    console.log("🔥 JOB CS LINE dengan AutoSave + Confetti + Animasi keren");
</script>
</body>
</html>
