<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Bukti Kemenangan PULITOTO - V2 Pagination</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        /* CSS Tampilan Aplikasi Generator - DISELARASKAN DENGAN NOTE PAD REPORT ONLINE */
        :root {
            --gold: #FFD700;
            --gold-dark: #FFA500;
            --dark-bg: #0F172A;
            --card-bg: #ffffff;
            --text-main: #0F172A;
            --text-muted: #475569;
            --border: #e2e8f0;
            --input-bg: #f8fafc;
            --accent-gold: #FFD700;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            color: var(--text-main);
            min-height: 100vh;
            padding: 20px;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 260px;
            background: var(--dark-bg);
            z-index: 0;
            clip-path: ellipse(120% 100% at 50% 0%);
        }

        .app-container {
            position: relative;
            z-index: 10;
            max-width: 800px;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 35px -10px rgba(15, 23, 42, 0.15);
            border: 1px solid var(--border);
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header img {
            max-width: 180px;
            margin-bottom: 15px;
            border-radius: 12px;
        }

        .header h1 {
            font-size: 24px;
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 700;
            color: var(--dark-bg);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .header p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 5px;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 25px;
            padding: 20px;
            background: var(--input-bg);
            border-radius: 16px;
            border: 1px solid var(--border);
        }

        .form-title {
            font-size: 16px;
            font-weight: 700;
            color: var(--dark-bg);
            margin-bottom: 5px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .input-group label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-muted);
        }

        input[type="text"], textarea {
            background: white;
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px;
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
            resize: vertical;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--dark-bg);
            box-shadow: 0 0 0 3px rgba(15, 23, 42, 0.1);
        }

        textarea { min-height: 100px; }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            flex: 1;
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-generate {
            background: var(--dark-bg);
            color: white;
        }

        .btn-generate:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(15, 23, 42, 0.2);
        }

        .btn-reset {
            background: white;
            color: var(--dark-bg);
            border: 1px solid var(--border);
        }

        .btn-reset:hover { 
            transform: translateY(-2px);
            background: var(--input-bg);
        }

        .btn-copy {
            background: #10b981;
            color: white;
            margin-top: 10px;
            width: 100%;
        }

        .btn-copy:hover { 
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(16, 185, 129, 0.3);
        }

        .output-section { margin-top: 25px; }

        .output-section label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--dark-bg);
            font-size: 13px;
        }

        #outputHtml {
            background: var(--input-bg);
            color: var(--text-main);
            font-family: 'Space Grotesk', monospace;
            font-size: 13px;
            min-height: 200px;
            border: 1px solid var(--border);
        }

        .notification {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--dark-bg);
            color: white;
            padding: 15px 25px;
            border-radius: 12px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(15, 23, 42, 0.2);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .notification.show {
            transform: translateY(0);
            opacity: 1;
        }

        @media (max-width: 600px) {
            .app-container { padding: 20px; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="bg-pattern"></div>

<div class="app-container">
    <div class="header">
        <img src="https://puli35266.com/resources/images/logo.png" alt="PULITOTO Logo">
        <h1>Generator Bukti Kemenangan</h1>
        <p>Versi Pagination (10 Item/Halaman)</p>
    </div>

    <div class="form-section">
        <div class="form-title">📝 Input Data Kemenangan Baru</div>
        
        <div class="input-group">
            <label>Judul Kemenangan</label>
            <input type="text" id="inputJudul" placeholder="Contoh: JACKPOT SWEET BONANZA">
        </div>

        <div class="input-group">
            <label>Link Gambar</label>
            <input type="text" id="inputGambar" placeholder="https://contoh-gambar.jpg">
        </div>

        <div class="input-group">
            <label>Teks Kemenangan (Bisa pakai HTML seperti &lt;br&gt;)</label>
            <textarea id="inputTeks" placeholder="Selamat kepada userid... berhadiah Rp..."></textarea>
        </div>

        <div class="btn-group">
            <button class="btn-reset" onclick="resetInput()">🔄 Reset Data Baru</button>
        </div>
    </div>

    <div class="input-group">
        <label>📂 Tempel HTML Lama (Paste di sini)</label>
        <textarea id="inputHtmlLama" placeholder="Tempel kode HTML lama Anda di sini..."></textarea>
    </div>

    <div class="btn-group" style="margin-top: 20px;">
        <button class="btn-generate" onclick="generateHtml()">⚡ GENERATE HTML</button>
    </div>

    <div class="output-section">
        <label>✅ Hasil HTML Baru (Salin kode di bawah ini)</label>
        <textarea id="outputHtml" readonly></textarea>
        <button class="btn-copy" onclick="copyOutput()">📋 Salin Kode HTML</button>
    </div>
</div>

<div id="notif" class="notification">Berhasil!</div>

<script>
    // ========== SEMUA FUNGSI ASLI TIDAK DIUBAH ==========
    function generateHtml() {
        const judul = document.getElementById('inputJudul').value.trim();
        const gambar = document.getElementById('inputGambar').value.trim();
        const teks = document.getElementById('inputTeks').value.trim();
        const htmlLama = document.getElementById('inputHtmlLama').value.trim();

        if (!judul || !gambar || !teks) {
            showNotif("Harap isi semua data kemenangan!");
            return;
        }

        // Template Kartu Baru
        const newCard = `
  <div class="card-kemenangan">
    <div class="judul">${escapeHtml(judul)}</div>
    <div class="img-wrap">
      <img src="${escapeHtml(gambar)}" alt="${escapeHtml(judul)}" onerror="this.src='https://via.placeholder.com/400x200/0a0a0a/FFD700?text=Gambar+Tidak+Tersedia'" />
    </div>
    <div class="deskripsi">${teks}</div>
  </div>`;

        let finalHtml = "";
        const parser = new DOMParser();
        
        // CSS dan JS untuk Pagination
        const paginationAssets = `
  <style>
    .pagination-nav {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 8px;
      margin-top: 30px;
      flex-wrap: wrap;
    }
    .pag-btn {
      background: rgba(26, 26, 26, 0.9);
      border: 2px solid #FFD700;
      color: #FFD700;
      padding: 8px 15px;
      border-radius: 8px;
      cursor: pointer;
      font-family: 'Poppins', sans-serif;
      font-size: 13px;
      font-weight: 600;
      transition: all 0.3s;
      text-decoration: none;
    }
    .pag-btn:hover:not(.disabled) {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #000;
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(255, 215, 0, 0.4);
    }
    .pag-btn.active {
      background: linear-gradient(135deg, #FFD700, #FFA500);
      color: #000;
      font-weight: bold;
      border-color: #FFD700;
    }
    .pag-btn.disabled {
      opacity: 0.5;
      cursor: not-allowed;
      border-color: #555;
      color: #555;
    }
    .page-info {
        color: #FFD700;
        font-size: 12px;
        margin-top: 10px;
        text-align: center;
    }
  </style>

  <script>
    (function() {
        const wrapper = document.querySelector('.kemenangan-wrapper');
        if (!wrapper) return;

        if (wrapper.classList.contains('paginated')) return;
        wrapper.classList.add('paginated');

        let paginationDiv = wrapper.querySelector('.pagination-nav');
        if (!paginationDiv) {
            paginationDiv = document.createElement('div');
            paginationDiv.className = 'pagination-nav';
            wrapper.appendChild(paginationDiv);
        }

        const cards = Array.from(wrapper.querySelectorAll('.card-kemenangan'));
        const itemsPerPage = 10;
        let currentPage = 1;
        const totalPages = Math.ceil(cards.length / itemsPerPage);

        function showPage(page) {
            if (page < 1) page = 1;
            if (page > totalPages) page = totalPages;
            currentPage = page;

            const start = (currentPage - 1) * itemsPerPage;
            const end = start + itemsPerPage;

            cards.forEach((card, index) => {
                if (index >= start && index < end) {
                    card.style.display = 'block';
                    card.style.animation = 'none';
                    card.offsetHeight;
                    card.style.animation = null; 
                } else {
                    card.style.display = 'none';
                }
            });
            
            renderPagination();
        }

        function renderPagination() {
            let html = '';
            
            html += '<button class="pag-btn ' + (currentPage === 1 ? 'disabled' : '') + '" onclick="window.paginateKemenangan(' + (currentPage - 1) + ')">« Prev</button>';
            
            if (totalPages <= 7) {
                for (let i = 1; i <= totalPages; i++) {
                    html += '<button class="pag-btn ' + (i === currentPage ? 'active' : '') + '" onclick="window.paginateKemenangan(' + i + ')">' + i + '</button>';
                }
            } else {
                html += '<button class="pag-btn ' + (1 === currentPage ? 'active' : '') + '" onclick="window.paginateKemenangan(1)">1</button>';

                if (currentPage > 3) {
                    html += '<span style="color:#FFD700">...</span>';
                }

                let startPage = Math.max(2, currentPage - 1);
                let endPage = Math.min(totalPages - 1, currentPage + 1);

                if (currentPage === 1) endPage = 3;
                if (currentPage === totalPages) startPage = totalPages - 2;

                for (let i = startPage; i <= endPage; i++) {
                    html += '<button class="pag-btn ' + (i === currentPage ? 'active' : '') + '" onclick="window.paginateKemenangan(' + i + ')">' + i + '</button>';
                }

                if (currentPage < totalPages - 2) {
                    html += '<span style="color:#FFD700">...</span>';
                }

                html += '<button class="pag-btn ' + (totalPages === currentPage ? 'active' : '') + '" onclick="window.paginateKemenangan(' + totalPages + ')">' + totalPages + '</button>';
            }

            html += '<button class="pag-btn ' + (currentPage === totalPages || totalPages === 0 ? 'disabled' : '') + '" onclick="window.paginateKemenangan(' + (currentPage + 1) + ')">Next »</button>';
            
            paginationDiv.innerHTML = html;
            
            if(totalPages > 0) {
                const startItem = (currentPage - 1) * itemsPerPage + 1;
                const endItem = Math.min(currentPage * itemsPerPage, cards.length);
                const infoDivId = 'page-info-div';
                let infoDiv = document.getElementById(infoDivId);
                if(!infoDiv) {
                    infoDiv = document.createElement('div');
                    infoDiv.id = infoDivId;
                    infoDiv.className = 'page-info';
                    wrapper.appendChild(infoDiv);
                }
                infoDiv.innerText = 'Menampilkan ' + startItem + ' - ' + endItem + ' dari ' + cards.length + ' kemenangan';
            }
        }

        window.paginateKemenangan = function(page) {
            showPage(page);
        };

        if (cards.length > itemsPerPage) {
            showPage(1);
        } else {
            paginationDiv.style.display = 'none';
        }
    })();
  <\/script>`;

        if (htmlLama) {
            const doc = parser.parseFromString(htmlLama, 'text/html');
            const wrapper = doc.querySelector('.kemenangan-wrapper');

            if (wrapper) {
                const oldScripts = wrapper.querySelectorAll('script');
                oldScripts.forEach(s => s.remove());
                
                const oldNav = wrapper.querySelector('.pagination-nav');
                if(oldNav) oldNav.remove();
                
                const oldInfo = wrapper.querySelector('.page-info');
                if(oldInfo) oldInfo.remove();

                const marquee = wrapper.querySelector('.marquee-banner');
                const firstCard = wrapper.querySelector('.card-kemenangan');
                const tempDiv = doc.createElement('div');
                tempDiv.innerHTML = newCard;
                const newCardNode = tempDiv.firstElementChild;

                if (marquee) {
                    marquee.after(newCardNode);
                } else if (firstCard) {
                    firstCard.before(newCardNode);
                } else {
                    wrapper.appendChild(newCardNode);
                }

                const tempWrapperDiv = doc.createElement('div');
                tempWrapperDiv.innerHTML = wrapper.outerHTML;
                const targetWrapper = tempWrapperDiv.querySelector('.kemenangan-wrapper');
                
                const scriptEl = doc.createElement('div');
                scriptEl.innerHTML = paginationAssets;
                targetWrapper.appendChild(scriptEl.firstElementChild);
                targetWrapper.appendChild(scriptEl.firstElementChild);

                finalHtml = targetWrapper.outerHTML;

            } else {
                finalHtml = newCard + "\n\n" + htmlLama;
            }
        } else {
            finalHtml = `<div class="kemenangan-wrapper">
  ${newCard}
  ${paginationAssets}
</div>`;
        }

        document.getElementById('outputHtml').value = finalHtml;
        showNotif("HTML Berhasil Di-generate dengan Pagination!");
    }

    function escapeHtml(text) {
        if (!text) return text;
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    function resetInput() {
        document.getElementById('inputJudul').value = '';
        document.getElementById('inputGambar').value = '';
        document.getElementById('inputTeks').value = '';
        showNotif("Form Input Direset!");
    }

    function copyOutput() {
        const outputText = document.getElementById('outputHtml');
        outputText.select();
        outputText.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(outputText.value)
            .then(() => {
                showNotif("Kode HTML Disalin!");
            })
            .catch(err => {
                showNotif("Gagal menyalin.");
            });
    }

    function showNotif(message) {
        const notif = document.getElementById('notif');
        notif.textContent = message;
        notif.classList.add('show');
        setTimeout(() => {
            notif.classList.remove('show');
        }, 2000);
    }
</script>
</body>
</html>
