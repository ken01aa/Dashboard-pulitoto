<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kendala Bank — Coming Soon</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --gold: #FFD700;
            --gold-dark: #FFA500;
            --dark-bg: #0F172A;
            --card-bg: #ffffff;
            --text-main: #0F172A;
            --text-muted: #475569;
            --border: #e2e8f0;
            --input-bg: #f8fafc;
            --accent-gold: #FFD700;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: #f8fafc;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow-x: auto;
        }

        .bg-pattern {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 260px;
            background: var(--dark-bg);
            z-index: 0;
            clip-path: ellipse(120% 100% at 50% 0%);
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 40px 30px;
            box-shadow: 0 20px 35px -10px rgba(15, 23, 42, 0.15);
            border: 1px solid var(--border);
            text-align: center;
        }

        /* Logo */
        .logo {
            margin-bottom: 2rem;
        }

        .logo-wrapper {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--input-bg);
            padding: 12px 28px;
            border-radius: 80px;
            border: 1px solid var(--border);
            transition: all 0.3s;
        }

        .logo-wrapper:hover {
            border-color: var(--gold);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.1);
        }

        .logo-icon {
            width: 44px;
            height: 44px;
            background: var(--dark-bg);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-icon svg {
            width: 26px;
            height: 26px;
        }

        .logo-text {
            font-size: 1.3rem;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--dark-bg);
            font-family: 'Space Grotesk', sans-serif;
        }

        /* Judul Utama */
        .title {
            font-size: 3.5rem;
            font-weight: 800;
            letter-spacing: -0.03em;
            color: var(--dark-bg);
            font-family: 'Space Grotesk', sans-serif;
            margin: 1rem 0 0.5rem;
        }

        /* Badge Coming Soon */
        .coming-soon {
            display: inline-block;
            background: linear-gradient(135deg, var(--gold), var(--gold-dark));
            padding: 6px 24px;
            border-radius: 40px;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--dark-bg);
            letter-spacing: 2px;
            margin: 1rem 0;
            text-transform: uppercase;
        }

        /* Penjelasan */
        .description {
            max-width: 480px;
            margin: 1rem auto;
            color: var(--text-muted);
            font-size: 1rem;
            line-height: 1.6;
            font-weight: 400;
        }

        /* Status */
        .status {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin: 1rem 0 2rem;
            display: inline-block;
            padding: 5px 16px;
            background: var(--input-bg);
            border-radius: 40px;
            border: 1px solid var(--border);
        }

        /* Countdown Timer */
        .countdown {
            margin: 2rem 0;
        }

        .timer {
            display: flex;
            justify-content: center;
            gap: 1.2rem;
            flex-wrap: wrap;
        }

        .time-card {
            background: var(--input-bg);
            border-radius: 20px;
            padding: 1rem 1.2rem;
            min-width: 85px;
            border: 1px solid var(--border);
            transition: all 0.3s ease;
        }

        .time-card:hover {
            border-color: var(--gold);
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(255, 215, 0, 0.15);
        }

        .time-number {
            font-size: 2.8rem;
            font-weight: 800;
            color: var(--dark-bg);
            line-height: 1;
            font-feature-settings: "tnum";
            font-family: 'Space Grotesk', monospace;
        }

        .time-label {
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 0.3rem;
        }

        /* Garis dekorasi */
        .decor-line {
            width: 60px;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 2rem auto 0;
        }

        @media (max-width: 550px) {
            .container { padding: 30px 20px; }
            .title { font-size: 2.5rem; }
            .time-number { font-size: 1.8rem; }
            .time-card { min-width: 65px; padding: 0.7rem 0.8rem; }
            .logo-wrapper { padding: 8px 20px; }
            .logo-text { font-size: 1rem; }
        }
    </style>
</head>
<body>

<div class="bg-pattern"></div>

<div class="container">
    <!-- LOGO + NAMA DASHBOARD -->
    <div class="logo">
        <div class="logo-wrapper">
            <div class="logo-icon">
                <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path d="M3 9L12 3L21 9L12 15L3 9Z" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M5 10.5V16.5C5 17.6 5.9 18.5 7 18.5H17C18.1 18.5 19 17.6 19 16.5V10.5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M12 15V20" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M9 20H15" stroke="white" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </div>
            <span class="logo-text">ABOUT BANK</span>
        </div>
    </div>

    <!-- NAMA DASHBOARD UTAMA -->
    <h1 class="title">KENDALA BANK</h1>

    <!-- COMING SOON BADGE -->
    <div class="coming-soon">COMING SOON</div>

    <!-- PENJELASAN DASHBOARD -->
    <p class="description">
        Dashboard pusat kendali untuk memantau, mendeteksi, dan menganalisis<br>
        gangguan layanan perbankan secara real-time.
    </p>

    <!-- STATUS PENGEMBANGAN -->
    <div class="status">
        ⚡ Dalam pengembangan intensif
    </div>

    <!-- GRAFIK WAKTU MUNDUR - 14 HARI -->
    <div class="countdown">
        <div class="timer" id="timer">
            <div class="time-card">
                <div class="time-number" id="days">00</div>
                <div class="time-label">HARI</div>
            </div>
            <div class="time-card">
                <div class="time-number" id="hours">00</div>
                <div class="time-label">JAM</div>
            </div>
            <div class="time-card">
                <div class="time-number" id="minutes">00</div>
                <div class="time-label">MENIT</div>
            </div>
            <div class="time-card">
                <div class="time-number" id="seconds">00</div>
                <div class="time-label">DETIK</div>
            </div>
        </div>
    </div>

    <div class="decor-line"></div>
</div>

<script>
    // COUNTDOWN 14 HARI DARI SEKARANG
    const targetDate = new Date();
    targetDate.setDate(targetDate.getDate() + 14);
    targetDate.setHours(0, 0, 0, 0);

    function updateCountdown() {
        const now = new Date().getTime();
        const distance = targetDate - now;

        if (distance < 0) {
            document.getElementById('days').innerText = "00";
            document.getElementById('hours').innerText = "00";
            document.getElementById('minutes').innerText = "00";
            document.getElementById('seconds').innerText = "00";
            return;
        }

        const days = Math.floor(distance / (1000 * 60 * 60 * 24));
        const hours = Math.floor((distance % (86400000)) / (3600000));
        const minutes = Math.floor((distance % 3600000) / 60000);
        const seconds = Math.floor((distance % 60000) / 1000);

        document.getElementById('days').innerText = days.toString().padStart(2, '0');
        document.getElementById('hours').innerText = hours.toString().padStart(2, '0');
        document.getElementById('minutes').innerText = minutes.toString().padStart(2, '0');
        document.getElementById('seconds').innerText = seconds.toString().padStart(2, '0');
    }

    updateCountdown();
    setInterval(updateCountdown, 1000);
</script>
</body>
</html>
